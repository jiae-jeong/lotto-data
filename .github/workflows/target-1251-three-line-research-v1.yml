name: target-1251-three-line-research-v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/three_line_research_1251_v1.py'
      - 'automation/tests_v2/test_three_line_research_1251.py'
      - 'automation/research_queue_v2.json'
      - 'research/weekly_purchase/1251/THREE_LINE_RESEARCH_PREREG_E045_20261114.json'
      - '.github/workflows/target-1251-three-line-research-v1.yml'

permissions:
  contents: write

concurrency:
  group: target-1251-three-line-research-v1
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check whether E045 is still pending
        id: check
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          queue = json.loads(Path('automation/research_queue_v2.json').read_text(encoding='utf-8'))
          task = next((item for item in queue.get('tasks', []) if item.get('id') == 'E045_THREE_LINE_DISJOINT_PORTFOLIO_WALKFORWARD_v1'), None)
          if task is None:
              raise SystemExit('E045 queue entry is missing')
          event = os.environ['GITHUB_EVENT_NAME']
          status = task.get('execution_status')
          should_run = event == 'workflow_dispatch' or status == 'IMPLEMENTED_AWAITING_DEDICATED_WORKFLOW_RUN'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('should_run=' + ('true' if should_run else 'false') + '\n')
          print({'event': event, 'task_status': status, 'should_run': should_run})
          PY

  research:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.5'

      - name: Compile runner and tests
        run: |
          python -m py_compile automation/three_line_research_1251_v1.py automation/tests_v2/test_three_line_research_1251.py

      - name: Run E045 geometry and readiness tests
        run: python -B -m unittest automation.tests_v2.test_three_line_research_1251 -v

      - name: Execute preregistered historical walk-forward
        id: study
        run: |
          set -euo pipefail
          DATE="$(TZ=Asia/Seoul date +%F)"
          RUN_ID="gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python -B automation/three_line_research_1251_v1.py --date "$DATE" --run-id "$RUN_ID"

      - name: Verify strict gates, data provenance, geometry, and manifest
        env:
          RUN_DATE: ${{ steps.study.outputs.date }}
          RUN_ID: ${{ steps.study.outputs.run_id }}
        run: |
          python -B - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root = Path.cwd()
          folder = root / 'analysis' / os.environ['RUN_DATE'] / os.environ['RUN_ID'] / 'E045_THREE_LINE_DISJOINT_PORTFOLIO_WALKFORWARD_v1'
          completion = json.loads((folder / 'COMPLETION.json').read_text(encoding='utf-8'))
          verification = json.loads((folder / 'VERIFICATION.json').read_text(encoding='utf-8'))
          inference = json.loads((folder / 'INFERENCE.json').read_text(encoding='utf-8'))
          assert completion['status'] == 'COMPLETE'
          assert completion['strict_pass_ready'] is False
          assert verification['status'] == 'PASS'
          assert verification['data_cutoff'] == 1249
          assert verification['target_range'] == [401, 1249]
          assert verification['target_count'] == 849
          assert verification['prediction_records'] == 849
          assert verification['random_bundles_total'] == 101880
          assert verification['training_cutoff_violations'] == 0
          assert verification['leakage_failures'] == 0
          assert verification['future_predictions'] == 0
          assert verification['no_future_leakage'] is True
          assert verification['portfolio_geometry_violations'] == 0
          assert verification['random_geometry_violations'] == 0
          assert verification['strict_pass_ready'] is False
          assert inference['strict_pass_ready'] is False
          assert inference['prospective_minimum_target_count'] is None
          assert inference['prospective_completion_rule'] is None
          with (folder / 'PREDICTIONS.csv').open(encoding='utf-8-sig', newline='') as stream:
              predictions = list(csv.DictReader(stream))
          assert len(predictions) == 849
          for row in predictions:
              assert int(row['training_through_round']) == int(row['target_round']) - 1
              lines = [set(map(int, row[f'line{i}'].split())) for i in range(1, 4)]
              assert all(len(line) == 6 for line in lines)
              assert len(set().union(*lines)) == 18
          manifest_path = folder / 'SHA256_MANIFEST.csv'
          with manifest_path.open(encoding='utf-8-sig', newline='') as stream:
              manifest = list(csv.DictReader(stream))
          assert len(manifest) == 8
          assert {'COMPLETION.json', 'VERIFICATION.json', 'REPORT.md', 'INFERENCE.json'} <= {x['path'] for x in manifest}
          for row in manifest:
              artifact = folder / row['path']
              raw = artifact.read_bytes()
              assert len(raw) == int(row['bytes'])
              assert hashlib.sha256(raw).hexdigest() == row['sha256']
          print({
              'status': 'PASS',
              'targets': len(predictions),
              'random_bundles': verification['random_bundles_total'],
              'manifest_entries': len(manifest),
              'historical_strict_gate_pass': inference['historical_strict_gate_pass'],
              'strict_pass_ready': False
          })
          PY

      - name: Publish immutable E045 evidence
        env:
          RUN_DATE: ${{ steps.study.outputs.date }}
          RUN_ID: ${{ steps.study.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "analysis/$RUN_DATE/$RUN_ID"
          git diff --cached --quiet && { echo 'No E045 evidence staged'; exit 1; }
          git commit -m 'research: execute E045 target-1251 three-line walkforward'
          git push origin HEAD:main

      - name: Preserve failed attempt evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e045-three-line-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            analysis/${{ steps.study.outputs.date }}/${{ steps.study.outputs.run_id }}/E045_THREE_LINE_DISJOINT_PORTFOLIO_WALKFORWARD_v1/**
          if-no-files-found: warn

name: target-1251-e063-three-line-last-digit-occupancy-transition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/three_line_last_digit_transition_e063.py'
      - 'automation/tests_v2/test_three_line_last_digit_transition_e063.py'
      - 'research/weekly_purchase/1251/E063_THREE_LINE_LAST_DIGIT_OCCUPANCY_TRANSITION_PREREG_20261116.json'
      - 'automation/research_queue_v2.json'
      - '.github/workflows/target-1251-e063-three-line-last-digit-transition.yml'
permissions:
  contents: write
concurrency:
  group: target-1251-e063-three-line-last-digit-transition
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse duplicate historical evaluation
        id: one-shot
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True).splitlines()
          suffix = "/E063_THREE_LINE_LAST_DIGIT_OCCUPANCY_TRANSITION_v1/COMPLETION.json"
          complete = any(path.endswith(suffix) for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("already_complete=" + ("true" if complete else "false") + "\n")
          print("E063 already complete; successful no-op." if complete else "E063 pending; execute frozen study.")
          PY
      - name: Verify frozen preregistration, implementation blobs, policy, queue, and canonical data
        if: steps.one-shot.outputs.already_complete != 'true'
        run: |
          python -B automation/three_line_last_digit_transition_e063.py --preflight
          python -m py_compile automation/three_line_last_digit_transition_e063.py automation/three_line_research_1251_v1.py automation/tests_v2/test_three_line_last_digit_transition_e063.py
      - name: Run E063 contract and leakage tests
        if: steps.one-shot.outputs.already_complete != 'true'
        run: python -B -m unittest automation.tests_v2.test_three_line_last_digit_transition_e063 -v
      - name: Run E063 historical walk-forward
        if: steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -B automation/three_line_last_digit_transition_e063.py \
            --date 2026-11-16 --run-id "gha_${RUN_ID}_${RUN_ATTEMPT}"
      - name: Verify evidence, update queue and reconcile current master audit
        if: success() && steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          run_id = os.environ["RUN_ID"]
          attempt = os.environ["RUN_ATTEMPT"]
          relative = Path("analysis/2026-11-16") / f"gha_{run_id}_{attempt}" / "E063_THREE_LINE_LAST_DIGIT_OCCUPANCY_TRANSITION_v1"
          output = Path.cwd() / relative
          expected = {"PREDICTIONS.csv", "RANDOM_BASELINE.csv", "BLOCK_STABILITY.csv", "MODEL_SPEC.json", "INFERENCE.json", "VERIFICATION.json", "COMPLETION.json", "REPORT.md", "SHA256_MANIFEST.csv"}
          assert {p.name for p in output.iterdir() if p.is_file()} == expected
          manifest = list(csv.DictReader((output / "SHA256_MANIFEST.csv").open(encoding="utf-8-sig", newline="")))
          assert len(manifest) == 8
          assert {row["path"] for row in manifest} == expected - {"SHA256_MANIFEST.csv"}
          for row in manifest:
              raw = (output / row["path"]).read_bytes()
              assert len(raw) == int(row["bytes"])
              assert hashlib.sha256(raw).hexdigest() == row["sha256"], row["path"]
          verification = json.loads((output / "VERIFICATION.json").read_text(encoding="utf-8"))
          inference = json.loads((output / "INFERENCE.json").read_text(encoding="utf-8"))
          completion = json.loads((output / "COMPLETION.json").read_text(encoding="utf-8"))
          assert verification["status"] == "PASS" and verification["manifest_status"] == "PASS"
          assert completion["study_id"] == "E063_THREE_LINE_LAST_DIGIT_OCCUPANCY_TRANSITION_v1" and completion["status"] == "COMPLETE"
          assert verification["data_cutoff"] == 1250 and verification["data_prefix_sha256"] == "7203238dae69ce281c59e6a0928cc187b11d88ed342685cd2dd2f214f063b3c2"
          assert verification["target_range"] == [401, 1250] and verification["target_count"] == 850
          assert verification["random_bundles_per_target"] == 120 and verification["random_bundles_total"] == 102000
          assert verification["leakage_failures"] == 0 and verification["future_predictions"] == 0 and verification["training_cutoff_violations"] == 0
          assert verification["portfolio_geometry_violations"] == 0 and verification["random_geometry_violations"] == 0
          assert verification["strict_pass_ready"] is False and inference["strict_pass_ready"] is False and completion["strict_pass_ready"] is False
          queue_path = Path("automation/research_queue_v2.json")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          task_id = "E063_THREE_LINE_LAST_DIGIT_OCCUPANCY_TRANSITION_v1"
          task = next(x for x in queue["tasks"] if x["id"] == task_id)
          status = "EXECUTED_HISTORICAL_GATE_PASS_PROSPECTIVE_PENDING" if inference["historical_strict_gate_pass"] else "EXECUTED_HISTORICAL_STRICT_FAIL"
          task["execution_status"] = status
          task["spec"]["execution_status"] = status
          task["execution_result"] = {
              "status": "COMPLETE_HISTORICAL_DIAGNOSTIC_ONLY", "verification_status": "PASS",
              "result_path": relative.as_posix(), "data_cutoff": 1250, "targets": 850,
              "random_bundles_total": 102000, "manifest_entries": 8, "manifest_status": "PASS",
              "leakage_failures": 0, "historical_strict_gate_pass": inference["historical_strict_gate_pass"],
              "strict_portfolio_pass": False, "strict_pass_ready": False,
              "target_1251_three_line_readiness_eligible": False, "purchase_recommendation_generated": False,
              "any2_positive_block_share": inference["any2_positive_block_share"], "metrics": inference["metrics"]
          }
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          audit_path = Path("research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261116.json")
          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          audit["daily_master_run_id"] = 43815826760
          audit["daily_master_run_number"] = 111
          audit["daily_master_run_url"] = "https://github.com/jiae-jeong/lotto-data/actions/runs/43815826760"
          audit["daily_master_run_conclusion"] = "success"
          audit["daily_master_status"] = "PARTIAL"
          audit["daily_master_run_id_is_latest_verified"] = True
          audit["daily_master_latest_verified_actions_run"] = {
              "run_id": 43815826760, "run_number": 111, "conclusion": "success",
              "result_path": "analysis/2026-11-16/MASTER_FULL_V5_062611_026797",
              "data_cutoff": 1250, "status": "PARTIAL", "v4_targets": 1050,
              "v4_b_predictions": 8400, "v4_random_tickets": 1050000,
              "v4_leakage_failures": 0, "v5_successor_predictions": 3150,
              "v5_successor_leakage_failures": 0, "v5_manifest_entries": 14,
              "v5_manifest_status": "PASS"
          }
          audit.setdefault("ineligible_research", {})[task_id] = "Independent last-digit occupancy transition historical diagnostic; not prospective confirmation and not eligible for STRICT_PASS_READY."
          blocking = audit.setdefault("blocking_reasons", [])
          reason = "E063 last-digit occupancy transition completed as a historical diagnostic; it cannot create STRICT_PASS_READY without the still-unspecified prospective confirmation rule."
          if reason not in blocking:
              blocking.append(reason)
          audit["latest_additional_research"] = {
              "study_id": task_id, "result_path": relative.as_posix(), "verification_status": "PASS",
              "historical_strict_gate_pass": inference["historical_strict_gate_pass"],
              "strict_pass_ready": False, "purchase_recommendation_generated": False
          }
          audit["queue_registered_task_count"] = len(queue["tasks"])
          audit["queue_generic_runnable_task_count"] = 0
          audit["queue_latest_dedicated_task_status"] = status
          audit["notes"] = (audit.get("notes", "") + "\n2026-11-16 E063 completed: " + status +
              "; 850 historical targets; 102000 geometry-matched random portfolios; 4000 moving-block bootstrap replicates; leakage 0; manifest 8/8; no strict readiness or purchase lines. DAILY MASTER Actions run #111 (43815826760) verified successful, cutoff 1250, PARTIAL.").strip()
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          kst = timezone(timedelta(hours=9))
          reconciliation = {
              "reconciliation_id": "DAILY_MASTER_ARTIFACT_RECONCILIATION_20261116_RUN111",
              "date_kst": "2026-11-16", "reconciled_at_kst": datetime.now(kst).isoformat(),
              "classification": "LATEST_DAILY_MASTER_ACTIONS_RUN_111_VERIFIED",
              "latest_artifact": {
                  "workflow": "daily-lotto-master-v5", "workflow_run_id": 43815826760,
                  "run_number": 111, "run_url": "https://github.com/jiae-jeong/lotto-data/actions/runs/43815826760",
                  "conclusion": "success", "artifact_commit_sha": "b8e4d0b3b23c2ff8a48d0ece71e4bf5e265544da",
                  "data_cutoff": 1250, "status": "PARTIAL",
                  "v4_path": "analysis/2026-11-16/MASTER_FULL_V4_061819_985663",
                  "v5_path": "analysis/2026-11-16/MASTER_FULL_V5_062611_026797",
                  "v4": {"targets": 1050, "b_prediction_records": 8400, "random_tickets": 1050000, "leakage_failures": 0},
                  "v5": {"successor_prediction_records": 3150, "successor_leakage_failures": 0, "manifest_entries": 14, "manifest_status": "PASS"}
              },
              "data_integrity": {"cutoff": 1250, "rows": 1250, "git_blob_sha": "66431d711919f179e4cb1349e2f7295c68a8735e", "sha256": "7203238dae69ce281c59e6a0928cc187b11d88ed342685cd2dd2f214f063b3c2"},
              "protected_files": {"AGENTS.md": "796f8a4367b6a4f64cbd4ec5615de75c992c7e0f", "LOTTO_PROJECT_PROTOCOL.md": "f770eb2215eb1acfb50ac1d79273c62d9b142084"},
              "purchase_readiness": {"status": "STRICT_FAIL", "strict_portfolio_pass": False, "strict_pass_ready": False, "ready_file": None, "final_purchase_freeze_allowed": False, "random_fallback_allowed": False},
              "queue_replenishment": {"registered_tasks": len(queue["tasks"]), "latest_task": task_id, "latest_task_status": status, "generic_runnable_tasks": 0, "three_line_ready_artifact": False},
              "e063": {"result_path": relative.as_posix(), "historical_strict_gate_pass": inference["historical_strict_gate_pass"], "strict_pass_ready": False, "manifest_entries": 8, "leakage_failures": 0}
          }
          recon_path = Path("research/weekly_purchase/1251/DAILY_MASTER_ARTIFACT_RECONCILIATION_20261116_RUN111.json")
          recon_path.write_text(json.dumps(reconciliation, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          audit["daily_master_artifact_reconciliation"] = {
              "path": recon_path.as_posix(), "classification": reconciliation["classification"],
              "actions_run_id_resolved": True, "workflow_run_id": 43815826760,
              "run_number": 111, "result_commit_sha": "b8e4d0b3b23c2ff8a48d0ece71e4bf5e265544da"
          }
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit and push verified E063 evidence and reconciled state
        if: success() && steps.one-shot.outputs.already_complete != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/2026-11-16 automation/research_queue_v2.json \
            research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261116.json \
            research/weekly_purchase/1251/DAILY_MASTER_ARTIFACT_RECONCILIATION_20261116_RUN111.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "research: execute preregistered E063 last-digit transition"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

name: target-1251-e064-block-persistent-null-calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/three_line_block_persistent_null_calibration_e064.js'
      - 'automation/tests_v2/test_three_line_block_persistent_null_calibration_e064.py'
      - 'research/weekly_purchase/1251/E064_THREE_LINE_BLOCK_PERSISTENT_NULL_CALIBRATION_PREREG_20261116.json'
      - 'research/weekly_purchase/1251/THREE_LINE_POLICY_1251_PLUS.json'
      - 'automation/research_queue_v2.json'
      - '.github/workflows/target-1251-e064-block-persistent-null-calibration.yml'

permissions:
  contents: write

concurrency:
  group: target-1251-e064-block-persistent-null-calibration
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse duplicate historical simulation
        id: one-shot
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True).splitlines()
          suffix = "/E064_BLOCK_PERSISTENT_NULL_CALIBRATION_v1/COMPLETION.json"
          complete = any(path.endswith(suffix) for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("already_complete=" + ("true" if complete else "false") + "\n")
          print("E064 already complete; successful no-op." if complete else "E064 pending; execute frozen null calibration.")
          PY

      - name: Compile runner and validate preregistration
        if: steps.one-shot.outputs.already_complete != 'true'
        run: |
          node --check automation/three_line_block_persistent_null_calibration_e064.js
          python -B -m unittest automation.tests_v2.test_three_line_block_persistent_null_calibration_e064 -v
          node automation/three_line_block_persistent_null_calibration_e064.js --preflight

      - name: Run deterministic geometry self-tests
        if: steps.one-shot.outputs.already_complete != 'true'
        run: node automation/three_line_block_persistent_null_calibration_e064.js --self-test

      - name: Execute preregistered block-persistent null calibration
        id: study
        if: steps.one-shot.outputs.already_complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(TZ=Asia/Seoul date +%F)"
          RUN_ID="gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          node automation/three_line_block_persistent_null_calibration_e064.js --date "$DATE" --run-id "$RUN_ID" | tee "$RUNNER_TEMP/e064-run.log"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "output_directory=analysis/$DATE/$RUN_ID/E064_BLOCK_PERSISTENT_NULL_CALIBRATION_v1" >> "$GITHUB_OUTPUT"

      - name: Verify hashes and preserve result plus queue state
        if: success() && steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_DATE: ${{ steps.study.outputs.date }}
          RUN_ID: ${{ steps.study.outputs.run_id }}
          OUTPUT_DIRECTORY: ${{ steps.study.outputs.output_directory }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os, subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path.cwd()
          out_rel = os.environ["OUTPUT_DIRECTORY"]
          out = root / out_rel
          expected = {
              "INFERENCE.json", "TRAJECTORY_SUMMARY.csv", "BLOCK_SHARE_COUNTS.csv",
              "SELF_TEST.json", "VERIFICATION.json", "COMPLETION.json", "REPORT.md",
              "SHA256_MANIFEST.csv"
          }
          assert out_rel.startswith("analysis/") and out.is_dir()
          assert {p.name for p in out.iterdir() if p.is_file()} == expected
          verification = json.loads((out / "VERIFICATION.json").read_text(encoding="utf-8"))
          completion = json.loads((out / "COMPLETION.json").read_text(encoding="utf-8"))
          inference = json.loads((out / "INFERENCE.json").read_text(encoding="utf-8"))
          assert verification["status"] == "PASS"
          assert verification["data_cutoff"] == 1250 and verification["data_rows"] == 1250
          assert verification["target_range"] == [401, 1250] and verification["target_count"] == 850
          assert verification["simulation"]["trajectories"] == 1000
          assert verification["simulation"]["portfolios_generated"] == 17000
          assert verification["simulation"]["portfolio_target_evaluations"] == 850000
          assert verification["geometry"]["geometry_violations"] == 0
          assert verification["geometry"]["within_block_assignment_violations"] == 0
          assert verification["training_cutoff_violations"] == 0 and verification["leakage_failures"] == 0
          assert verification["purchase_recommendation_generated"] is False
          assert verification["strict_pass_ready_created"] is False
          assert completion["status"] == "COMPLETE"
          assert completion["evidence_class"] == "NULL_GATE_CALIBRATION_ONLY"
          assert completion["strict_pass_ready"] is False
          assert inference["strict_gate_false_pass"]["denominator"] == 1000

          with (out / "SHA256_MANIFEST.csv").open(encoding="utf-8", newline="") as stream:
              manifest = list(csv.DictReader(stream))
          assert len(manifest) == 7
          assert {row["path"] for row in manifest} == expected - {"SHA256_MANIFEST.csv"}
          for row in manifest:
              raw = (out / row["path"]).read_bytes()
              assert len(raw) == int(row["bytes"])
              assert hashlib.sha256(raw).hexdigest() == row["sha256"], row["path"]

          with (out / "TRAJECTORY_SUMMARY.csv").open(encoding="utf-8", newline="") as stream:
              trajectories = list(csv.DictReader(stream))
          with (out / "BLOCK_SHARE_COUNTS.csv").open(encoding="utf-8", newline="") as stream:
              block_counts = list(csv.DictReader(stream))
          assert len(trajectories) == 1000
          assert len(block_counts) == 18
          assert sum(int(row["trajectory_count"]) for row in block_counts) == 1000

          queue_path = root / "automation/research_queue_v2.json"
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          task = next(item for item in queue["tasks"] if item["id"] == "E064_THREE_LINE_BLOCK_PERSISTENT_NULL_CALIBRATION_v1")
          stamp = datetime.now(ZoneInfo("Asia/Seoul")).isoformat()
          result = {
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "result_path": out_rel,
              "verification_status": "PASS",
              "manifest_entries": len(manifest),
              "data_cutoff": 1250,
              "target_count": 850,
              "trajectories": 1000,
              "portfolios_generated": 17000,
              "strict_gate_false_passes": inference["strict_gate_false_pass"]["false_passes"],
              "strict_gate_false_pass_rate": inference["strict_gate_false_pass"]["rate"],
              "strict_pass_ready": False,
              "purchase_recommendation_generated": False,
              "verified_at_kst": stamp
          }
          task["execution_status"] = "EXECUTED_NULL_CALIBRATION_ONLY"
          task["execution_result"] = result
          task["spec"]["execution_status"] = "EXECUTED_NULL_CALIBRATION_ONLY"
          task["spec"]["execution_result"] = result
          task["spec"]["execution_verified_at_kst"] = stamp
          queue["trigger_note"] = (
              "E064 completed one block-persistent non-predictive null calibration only. "
              "No target-1251 three-line predictive axis is promoted or ready; the strict gate and prospective-confirmation policy remain unchanged. "
              "Do not create post-hoc microvariants or infer purchase readiness from null calibration."
          )
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "--", out_rel, "research/daily/" + os.environ["RUN_DATE"] + "_E064_SUPPLEMENT.md", "automation/research_queue_v2.json"], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          subprocess.run(["git", "commit", "-m", "research: execute E064 block-persistent null calibration"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print(json.dumps({"status":"PUSHED","result":result}, ensure_ascii=False))
          PY

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e064-block-persistent-null-evidence
          path: |
            analysis/${{ steps.study.outputs.date }}/${{ steps.study.outputs.run_id }}/E064_BLOCK_PERSISTENT_NULL_CALIBRATION_v1
            research/daily/${{ steps.study.outputs.date }}_E064_SUPPLEMENT.md
            automation/research_queue_v2.json
          if-no-files-found: warn

name: target-1251-e048-three-line-bonus-transition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/three_line_bonus_transition_e048.py'
      - 'automation/tests_v2/test_three_line_bonus_transition_e048.py'
      - 'research/weekly_purchase/1251/E048_THREE_LINE_BONUS_TO_MAIN_TRANSITION_PREREG_20261114.json'
      - 'automation/research_queue_v2.json'

permissions:
  contents: write

concurrency:
  group: target-1251-e048-three-line-bonus-transition
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse duplicate historical evaluation
        id: one-shot
        shell: bash
        run: |
          if git ls-tree -r --name-only HEAD | grep '/E048_THREE_LINE_BONUS_TO_MAIN_TRANSITION_v1/COMPLETION.json
            echo "already_complete=true" >> "$GITHUB_OUTPUT"
            echo "E048 historical evaluation is already complete; this trigger is a successful no-op."
            exit 0
          fi
          echo "already_complete=false" >> "$GITHUB_OUTPUT"

      - name: Compile and run frozen contract tests
        if: steps.one-shot.outputs.already_complete != 'true'
        run: |
          python -m py_compile automation/three_line_bonus_transition_e048.py automation/tests_v2/test_three_line_bonus_transition_e048.py
          python -B -m unittest automation.tests_v2.test_three_line_bonus_transition_e048 -v

      - name: Run E048 historical walk-forward
        if: steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -B automation/three_line_bonus_transition_e048.py \
            --date 2026-11-14 \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"

      - name: Preserve validated E048 outputs
        if: success() && steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR="analysis/2026-11-14/gha_${RUN_ID}_${RUN_ATTEMPT}/E048_THREE_LINE_BONUS_TO_MAIN_TRANSITION_v1"
          test -f "$OUTDIR/VERIFICATION.json"
          test -f "$OUTDIR/COMPLETION.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTDIR"
          git diff --cached --check
          git commit -m "research: execute E048 three-line bonus transition [evidence]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to preserve E048 outputs after three push attempts." >&2
          exit 1

      - name: Preserve E048 failure evidence
        if: failure() && steps.one-shot.outputs.already_complete != 'true' && steps.one-shot.outcome == 'success'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR="analysis/2026-11-14/gha_${RUN_ID}_${RUN_ATTEMPT}/E048_THREE_LINE_BONUS_TO_MAIN_TRANSITION_v1"
          export OUTDIR
          mkdir -p "$OUTDIR"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["OUTDIR"]) / "FAILURE.json"
          p.write_text(json.dumps({
              "study_id": "E048_THREE_LINE_BONUS_TO_MAIN_TRANSITION_v1",
              "status": "FAILED",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "note": "See the GitHub Actions job log for the failing step. No purchase lines or readiness artifact are generated by this failure record."
          }, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTDIR/FAILURE.json"
          git commit -m "research: preserve E048 failure evidence"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to preserve E048 failure evidence." >&2
          exit 1
 >/dev/null; then

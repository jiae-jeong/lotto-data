name: target-1251-e052-three-line-dynamic-selector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/three_line_dynamic_selector_e052_v1.py'
      - 'automation/tests_v2/test_three_line_dynamic_selector_e052.py'
      - 'research/weekly_purchase/1251/E052_THREE_LINE_TRAILING_PERFORMANCE_SELECTOR_PREREG_20261115.json'
      - '.github/workflows/target-1251-e052-three-line-dynamic-selector.yml'

permissions:
  contents: write

concurrency:
  group: target-1251-e052-three-line-dynamic-selector
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen preregistration, source portfolios, policy, and canonical data
        id: preflight
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json, os, subprocess, io
          from pathlib import Path

          prereg_path = Path("research/weekly_purchase/1251/E052_THREE_LINE_TRAILING_PERFORMANCE_SELECTOR_PREREG_20261115.json")
          runner_path = Path("automation/three_line_dynamic_selector_e052_v1.py")
          test_path = Path("automation/tests_v2/test_three_line_dynamic_selector_e052.py")
          base_runner_path = Path("automation/three_line_research_1251_v1.py")
          policy_path = Path("research/weekly_purchase/1251/THREE_LINE_POLICY_1251_PLUS.json")
          prereg = json.loads(prereg_path.read_text(encoding="utf-8"))
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          frozen = prereg["frozen_blobs"]

          def blob(path):
              return subprocess.check_output(["git", "rev-parse", "HEAD:" + path.as_posix()], text=True).strip()

          assert blob(runner_path) == frozen["runner_blob_sha"]
          assert blob(test_path) == frozen["test_blob_sha"]
          assert blob(base_runner_path) == frozen["base_runner_blob_sha"]
          assert blob(policy_path) == frozen["policy_blob_sha"]
          assert blob(prereg_path) == "e44aef451d90376cbf4d05fee083e4d01cb11fb7"
          assert prereg["study_id"] == "E052_THREE_LINE_TRAILING_PERFORMANCE_SELECTOR_v1"
          assert prereg["preregistration_status"] == "FROZEN_BEFORE_EXECUTION"
          assert prereg["independent_research_axis"] is True
          assert prereg["historical_data_cutoff"] == 1249
          assert prereg["source_target_range"] == [401, 1249]
          assert prereg["evaluation_target_range"] == [501, 1249]
          assert prereg["selection"]["lookback_targets"] == 100
          assert prereg["selection"]["metric"] == "any2"
          assert prereg["selection"]["parameter_search"] is False
          assert prereg["selection"]["variants"] == 1
          assert prereg["inference"]["family_alpha"] == 0.05
          assert prereg["inference"]["alpha_per_metric"] == 0.0125
          assert prereg["inference"]["block_length_targets"] == 50
          assert prereg["inference"]["bootstrap_replicates"] == 4000
          assert prereg["inference"]["any2_positive_nonoverlapping_50_target_block_share_min"] == 0.65
          assert prereg["prospective_confirmation"]["minimum_target_count"] is None
          assert prereg["prospective_confirmation"]["completion_rule"] is None
          assert policy["policy_id"] == prereg["policy_id"]
          assert policy["purchase_lines"] == 3
          assert policy["strict_gate"]["family_alpha"] == prereg["inference"]["family_alpha"]
          assert policy["strict_gate"]["alpha_per_metric"] == prereg["inference"]["alpha_per_metric"]
          assert policy["strict_gate"]["any2_positive_nonoverlapping_50_target_block_share_min"] == prereg["inference"]["any2_positive_nonoverlapping_50_target_block_share_min"]
          assert policy["strict_gate"]["all_adjusted_moving_block_ci_lower_bounds_strictly_gt_zero"] is True
          assert policy["strict_gate"]["no_threshold_relaxation"] is True
          for key in ("mean_max_hit", "p_any2", "p_any3", "expected_union_coverage"):
              assert abs(float(policy["exact_null"][key]) - float(prereg["random_comparator"]["exact_null"][key])) < 1e-14

          assert [item["study_id"] for item in prereg["candidate_models"]] == prereg["selection"]["candidate_model_order"]
          for source in prereg["candidate_models"]:
              for path_key, blob_key in (
                  ("prediction_path", "prediction_blob_sha"),
                  ("manifest_path", "manifest_blob_sha"),
                  ("verification_path", "verification_blob_sha"),
              ):
                  assert blob(Path(source[path_key])) == source[blob_key], (source["study_id"], path_key)
              prediction = Path(source["prediction_path"]).read_bytes()
              assert len(prediction) == source["prediction_bytes"]
              assert hashlib.sha256(prediction).hexdigest() == source["prediction_sha256"]
              manifest_rows = list(csv.DictReader(Path(source["manifest_path"]).open(encoding="utf-8-sig", newline="")))
              entries = [row for row in manifest_rows if row["path"] == "PREDICTIONS.csv"]
              assert len(entries) == 1
              assert entries[0]["sha256"] == source["prediction_sha256"]
              assert int(entries[0]["bytes"]) == source["prediction_bytes"]
              verification = json.loads(Path(source["verification_path"]).read_text(encoding="utf-8"))
              assert verification["status"] == "PASS"
              assert verification["data_cutoff"] == source["source_data_cutoff"]
              assert verification["leakage_failures"] == 0
              assert verification["future_predictions"] == 0
              assert verification["training_cutoff_violations"] == 0

          raw = Path("lotto_data.csv").read_bytes()
          data_sha = hashlib.sha256(raw).hexdigest()
          assert data_sha == prereg["source_data_full_file_sha256"]
          rows = list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"), newline="")))
          assert len(rows) == 1250
          assert [int(row["round"]) for row in rows] == list(range(1, 1251))
          for row in rows:
              nums = [int(row[f"no{i}"]) for i in range(1, 7)]
              bonus = int(row["bonus"])
              assert len(set(nums)) == 6 and all(1 <= n <= 45 for n in nums)
              assert 1 <= bonus <= 45 and bonus not in nums
          last = rows[-1]
          assert last["date"] == "2026.11.14"
          assert [int(last[f"no{i}"]) for i in range(1, 7)] == [1, 5, 18, 23, 27, 28]
          assert int(last["bonus"]) == 8

          tracked = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True).splitlines()
          already_complete = any(path.endswith("/E052_THREE_LINE_TRAILING_PERFORMANCE_SELECTOR_v1/COMPLETION.json") for path in tracked)
          checkout_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("data_sha=" + data_sha + "\n")
              stream.write("checkout_sha=" + checkout_sha + "\n")
              stream.write("already_complete=" + ("true" if already_complete else "false") + "\n")
          if already_complete:
              print({"status": "ALREADY_COMPLETE_NOOP", "study_id": prereg["study_id"]})
              raise SystemExit(0)

          queue = json.loads(Path("automation/research_queue_v2.json").read_text(encoding="utf-8"))
          task = next(item for item in queue["tasks"] if item["id"] == prereg["study_id"])
          assert task["execution_status"] == "PREREGISTERED_PENDING_DEDICATED_WORKFLOW"
          assert task["spec"]["execution_mode"] == "dedicated_workflow"
          assert task["preregistration"] == prereg_path.as_posix()
          print({
              "status": "PREFLIGHT_PASS",
              "study_id": prereg["study_id"],
              "data_cutoff": 1249,
              "current_data_rows": 1250,
              "data_sha256": data_sha,
              "evaluation_target_range": prereg["evaluation_target_range"],
              "candidate_models": len(prereg["candidate_models"]),
              "lookback_targets": prereg["selection"]["lookback_targets"],
              "random_bundles_per_target": prereg["random_comparator"]["random_bundles_per_target"],
          })
          PY

      - name: Compile and run E052 and queue-contract tests
        if: steps.preflight.outputs.already_complete != 'true'
        run: |
          python -m py_compile automation/three_line_dynamic_selector_e052_v1.py automation/three_line_research_1251_v1.py automation/tests_v2/test_three_line_dynamic_selector_e052.py
          python -B -m unittest automation.tests_v2.test_three_line_dynamic_selector_e052 automation.tests_v2.test_independent_five_line -v

      - name: Execute preregistered nested three-line selector and matched random baseline
        if: steps.preflight.outputs.already_complete != 'true'
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(TZ=Asia/Seoul date +%F)"
          RUN_ID="gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python -B automation/three_line_dynamic_selector_e052_v1.py --date "$DATE" --run-id "$RUN_ID"

      - name: Verify immutable outputs, no leakage, strict gates, and update research queue
        if: success() && steps.preflight.outputs.already_complete != 'true'
        env:
          RUN_DATE: ${{ steps.execute.outputs.date }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          DATA_SHA: ${{ steps.preflight.outputs.data_sha }}
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          study_id = "E052_THREE_LINE_TRAILING_PERFORMANCE_SELECTOR_v1"
          run_id = os.environ["RUN_ID"]
          date = os.environ["RUN_DATE"]
          out = Path("analysis") / date / run_id / study_id
          prereg = json.loads(Path("research/weekly_purchase/1251/E052_THREE_LINE_TRAILING_PERFORMANCE_SELECTOR_PREREG_20261115.json").read_text(encoding="utf-8"))
          expected = set(prereg["expected_output_files"])
          assert {path.name for path in out.iterdir() if path.is_file()} == expected

          with (out / "SHA256_MANIFEST.csv").open(encoding="utf-8-sig", newline="") as stream:
              manifest = list(csv.DictReader(stream))
          assert len(manifest) == 10
          assert {row["path"] for row in manifest} == expected - {"SHA256_MANIFEST.csv"}
          for row in manifest:
              raw = (out / row["path"]).read_bytes()
              assert len(raw) == int(row["bytes"])
              assert hashlib.sha256(raw).hexdigest() == row["sha256"], row["path"]

          verification = json.loads((out / "VERIFICATION.json").read_text(encoding="utf-8"))
          completion = json.loads((out / "COMPLETION.json").read_text(encoding="utf-8"))
          inference = json.loads((out / "INFERENCE.json").read_text(encoding="utf-8"))
          assert verification["status"] == "PASS" and verification["study_id"] == study_id
          assert verification["data_cutoff"] == 1249 and verification["current_source_data_rows"] == 1250
          assert verification["data_sha256"] == os.environ["DATA_SHA"]
          assert verification["data_prefix_sha256"] == prereg["source_data_prefix_sha256"]
          assert verification["evaluation_target_range"] == [501, 1249]
          assert verification["target_count"] == 749 and verification["prediction_records"] == 749
          assert verification["selection_log_records"] == 749
          assert verification["candidate_model_count"] == 5 and verification["selection_lookback_targets"] == 100
          assert verification["training_cutoff_violations"] == 0
          assert verification["selection_training_cutoff_violations"] == 0
          assert verification["leakage_failures"] == 0 and verification["future_predictions"] == 0
          assert verification["portfolio_geometry_violations"] == 0 and verification["random_geometry_violations"] == 0
          assert verification["random_bundles_per_target"] == 120 and verification["random_bundles_total"] == 89880
          assert verification["no_future_leakage"] is True and verification["random_baseline_executed"] is True
          assert verification["parameter_search"] is False and verification["variants"] == 1
          assert verification["thresholds_changed"] is False and verification["alpha_changed"] is False
          assert verification["block_length_changed"] is False and verification["comparator_changed"] is False
          assert verification["strict_pass_ready"] is False and verification["purchase_recommendation_generated"] is False
          assert completion["study_id"] == study_id and completion["status"] == "COMPLETE"
          assert completion["target_count"] == 749 and completion["strict_pass_ready"] is False
          assert completion["purchase_recommendation_generated"] is False
          assert inference["study_id"] == study_id and inference["targets"] == 749
          assert inference["random_bundles_total"] == 89880 and inference["block_size"] == 50
          assert inference["block_lengths"] == [50] * 14 + [49]
          assert inference["strict_pass_ready"] is False

          predictions = list(csv.DictReader((out / "PREDICTIONS.csv").open(encoding="utf-8-sig", newline="")))
          selection = list(csv.DictReader((out / "MODEL_SELECTION_LOG.csv").open(encoding="utf-8-sig", newline="")))
          randoms = list(csv.DictReader((out / "RANDOM_BASELINE.csv").open(encoding="utf-8-sig", newline="")))
          blocks = list(csv.DictReader((out / "BLOCK_STABILITY.csv").open(encoding="utf-8-sig", newline="")))
          targets = list(range(501, 1250))
          assert [int(row["target_round"]) for row in predictions] == targets and len(predictions) == 749
          assert [int(row["target_round"]) for row in selection] == targets and len(selection) == 749
          assert [int(row["target_round"]) for row in randoms] == targets and len(randoms) == 749
          assert len(blocks) == 15 and [int(row["n"]) for row in blocks] == [50] * 14 + [49]
          model_order = prereg["selection"]["candidate_model_order"]
          for p, s, r in zip(predictions, selection, randoms):
              target = int(p["target_round"])
              assert int(p["training_through_round"]) == target - 1
              assert int(s["selection_training_start"]) == target - 100
              assert int(s["selection_training_end"]) == target - 1
              assert s["selection_uses_target_outcome"].lower() == "false"
              assert p["selected_model"] == s["selected_model"] and p["selected_model"] in model_order
              trailing_rates = {model: float(s[f"trailing_any2_{model}"]) for model in model_order}
              expected_model = max(model_order, key=lambda model: (trailing_rates[model], -model_order.index(model)))
              assert s["selected_model"] == expected_model
              lines = [set(map(int, p[f"line{i}"].split())) for i in (1, 2, 3)]
              assert all(len(line) == 6 for line in lines)
              assert len(set().union(*lines)) == 18
              assert all(not (lines[i] & lines[j]) for i in range(3) for j in range(i + 1, 3))
              assert int(r["random_bundles"]) == 120 and int(r["geometry_violations"]) == 0

          failed_gates = [
              name for name, item in inference["metrics"].items()
              if not item["lower_bound_strictly_gt_zero"]
          ]
          if float(inference["any2_positive_50_target_block_share"]) < 0.65:
              failed_gates.append("any2_positive_50_target_block_share")
          historical_pass = inference["historical_strict_gate_pass"] is True
          status = (
              "EXECUTED_HISTORICAL_GATE_PASS_PROSPECTIVE_PENDING"
              if historical_pass else "EXECUTED_HISTORICAL_STRICT_FAIL_OUTPUTS_PRESERVED"
          )

          queue_path = Path("automation/research_queue_v2.json")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          task = next(item for item in queue["tasks"] if item["id"] == study_id)
          task["execution_status"] = status
          task["spec"]["execution_status"] = status
          task["execution_result"] = {
              "workflow_name": "target-1251-e052-three-line-dynamic-selector",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_number": int(os.environ["RUN_NUMBER"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": "push",
              "workflow_run_conclusion": "success",
              "run_url": "https://github.com/jiae-jeong/lotto-data/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "completed_at_utc": datetime.now(timezone.utc).isoformat(),
              "result_path": out.as_posix(),
              "data_cutoff": 1249,
              "current_data_rows": 1250,
              "data_prefix_sha256": prereg["source_data_prefix_sha256"],
              "data_full_file_sha256": os.environ["DATA_SHA"],
              "target_range": [501, 1249],
              "target_count": 749,
              "prediction_records": 749,
              "candidate_model_count": 5,
              "selection_lookback_targets": 100,
              "random_bundles_per_target": 120,
              "random_bundles_total": 89880,
              "training_cutoff_violations": 0,
              "selection_training_cutoff_violations": 0,
              "leakage_failures": 0,
              "future_predictions": 0,
              "portfolio_geometry_violations": 0,
              "random_geometry_violations": 0,
              "verification_status": "PASS",
              "manifest_entries": 10,
              "manifest_status": "PASS",
              "historical_strict_gate_pass": historical_pass,
              "strict_portfolio_pass": False,
              "strict_pass_ready": False,
              "readiness_status": inference["readiness_status"],
              "failed_gates": failed_gates,
              "purchase_lines_generated": False,
              "final_purchase_freeze_allowed": False
          }
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"study_id": study_id, "execution_status": status, "failed_gates": failed_gates, "manifest_entries": 10}, ensure_ascii=False))
          PY

      - name: Commit verified E052 outputs and queue status
        if: success() && steps.preflight.outputs.already_complete != 'true'
        env:
          RUN_DATE: ${{ steps.execute.outputs.date }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="analysis/$RUN_DATE/$RUN_ID/E052_THREE_LINE_TRAILING_PERFORMANCE_SELECTOR_v1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT" automation/research_queue_v2.json
          if git diff --cached --quiet; then
            echo "No new E052 outputs or queue changes."
            exit 0
          fi
          git commit -m "research: execute E052 nested three-line model selector"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: lotto-today-top6-rankfamily-v61
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-top6-rankfamily-v61.yml'
      - 'automation/today_top6_rankfamily_v61.py'
permissions:
  contents: read
jobs:
  validate-v61:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V61 top6x2 rank-family selector
        run: python -B automation/today_top6_rankfamily_v61.py
      - name: Print strict result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('analysis/2026-10-30/TODAY_TOP6_RANKFAMILY_1248_V61.json'))
          print(json.dumps({'strict_pass':d['inference']['strict_portfolio_pass'],'status':d['final_status'],'delta':d['scorecard']['delta'],'ci':{k:v['adjusted_ci_delta'] for k,v in d['inference'].items() if isinstance(v,dict)},'share':{k:v['positive_50_round_block_share'] for k,v in d['inference'].items() if isinstance(v,dict)},'lines':d['current']['lines'],'policy':d['current']['chosen_policy'],'rank_mode':d['current']['rank_mode'],'null':d['scorecard']['matched_exact_label_null']},ensure_ascii=False))
          PY

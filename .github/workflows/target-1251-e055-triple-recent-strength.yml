name: target-1251-e055-triple-recent-strength

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/weekly_purchase/1251/E055_EXECUTE_20261116.trigger'

permissions:
  contents: write

concurrency:
  group: target-1251-e055-triple-recent-strength
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen E055 preregistration and E045 source evidence
        run: |
          python - <<'PY'
          import csv, hashlib, json, subprocess
          from pathlib import Path
          prereg=json.loads(Path("research/weekly_purchase/1251/E055_THREE_LINE_TRIPLE_RECENT_STRENGTH_PREREG_20261116.json").read_text(encoding="utf-8"))
          policy=json.loads(Path("research/weekly_purchase/1251/THREE_LINE_POLICY_1251_PLUS.json").read_text(encoding="utf-8"))
          queue=json.loads(Path("automation/research_queue_v2.json").read_text(encoding="utf-8"))
          frozen=prereg["frozen_blobs"]
          paths={
            "runner":"automation/three_line_triple_recent_strength_e055_v1.py",
            "test":"automation/tests_v2/test_three_line_triple_recent_strength_e055.py",
            "workflow":".github/workflows/target-1251-e055-triple-recent-strength.yml",
            "base_runner":"automation/three_line_research_1251_v1.py",
            "policy":"research/weekly_purchase/1251/THREE_LINE_POLICY_1251_PLUS.json",
            "source_predictions":"analysis/2026-11-14/gha_43595251776_1/E045_CUTOFF_REFRESH_1250_APPEND_ONLY_v1/PREDICTIONS.csv",
            "source_manifest":"analysis/2026-11-14/gha_43595251776_1/E045_CUTOFF_REFRESH_1250_APPEND_ONLY_v1/SHA256_MANIFEST.csv",
            "source_completion":"analysis/2026-11-14/gha_43595251776_1/E045_CUTOFF_REFRESH_1250_APPEND_ONLY_v1/COMPLETION.json",
            "source_verification":"analysis/2026-11-14/gha_43595251776_1/E045_CUTOFF_REFRESH_1250_APPEND_ONLY_v1/VERIFICATION.json",
            "source_prereg":"research/weekly_purchase/1251/E045_CUTOFF_REFRESH_1250_APPEND_ONLY_v1.json"
          }
          for key,path in paths.items():
              blob=subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              assert blob==frozen[key], (key,blob,frozen[key])
          assert prereg["study_id"]=="E055_THREE_LINE_TRIPLE_RECENT_STRENGTH_v1"
          assert prereg["date_kst"]=="2026-11-16" and prereg["historical_data_cutoff"]==1250
          assert prereg["target_range"]==[401,1250] and prereg["target_count"]==850
          assert prereg["trailing_window_targets"]==100 and prereg["forward_block_targets"]==50
          assert prereg["evaluation_block_starts"]==list(range(501,1251,50))
          assert prereg["random_trajectory_count"]==120 and prereg["random_bundles_total"]==102000
          assert prereg["bootstrap_replicates"]==4000 and prereg["bootstrap_block_length_blocks"]==3
          assert prereg["alpha"]==0.05 and prereg["parameter_search"] is False
          assert prereg["support_rule"]=="Pearson correlation > 0, 95% moving-block bootstrap lower bound > 0, and one-sided matched-random trajectory tail probability <= 0.05."
          assert prereg["source_data_sha256"]=="7203238dae69ce281c59e6a0928cc187b11d88ed342685cd2dd2f214f063b3c2"
          assert prereg["source_prediction_sha256"]=="585ec30a6d51f7bb02b00c8497e30ec47caac8527b7baf8d6781e7017d09ca04"
          source="analysis/2026-11-14/gha_43595251776_1/E045_CUTOFF_REFRESH_1250_APPEND_ONLY_v1"
          completion=json.loads(Path(source+"/COMPLETION.json").read_text(encoding="utf-8"))
          verification=json.loads(Path(source+"/VERIFICATION.json").read_text(encoding="utf-8"))
          assert completion["status"]=="COMPLETE" and completion["data_cutoff"]==1250 and completion["target_range"]==[401,1250]
          assert verification["status"]=="PASS" and verification["no_future_leakage"] is True
          assert verification["prediction_records"]==850 and verification["training_cutoff_violations"]==0
          pred_raw=Path(source+"/PREDICTIONS.csv").read_bytes()
          assert hashlib.sha256(pred_raw).hexdigest()==prereg["source_prediction_sha256"]
          manifest=list(csv.DictReader(Path(source+"/SHA256_MANIFEST.csv").open(encoding="utf-8-sig",newline="")))
          entry=next(x for x in manifest if x["path"]=="PREDICTIONS.csv")
          assert entry["sha256"]==prereg["source_prediction_sha256"] and int(entry["bytes"])==prereg["source_prediction_bytes"]
          raw=Path("lotto_data.csv").read_bytes()
          assert hashlib.sha256(raw).hexdigest()==prereg["source_data_sha256"]
          task=next(x for x in queue["tasks"] if x.get("id")==prereg["study_id"])
          assert task["execution_mode"]=="dedicated_workflow"
          assert task["execution_entrypoint"]=="automation/three_line_triple_recent_strength_e055_v1.py"
          assert task["workflow_entrypoint"]==".github/workflows/target-1251-e055-triple-recent-strength.yml"
          assert task["preregistration"]=="research/weekly_purchase/1251/E055_THREE_LINE_TRIPLE_RECENT_STRENGTH_PREREG_20261116.json"
          print("E055 frozen source/preregistration preflight PASS")
          PY

      - name: Compile and run E055 tests
        run: |
          python -m py_compile automation/three_line_triple_recent_strength_e055_v1.py automation/tests_v2/test_three_line_triple_recent_strength_e055.py
          python -B -m unittest automation.tests_v2.test_three_line_triple_recent_strength_e055 -v

      - name: Execute frozen triple-recent-strength falsification
        run: |
          set -euo pipefail
          DATE=2026-11-16
          RUN_ID="gha_"$GITHUB_RUN_ID"_"$GITHUB_RUN_ATTEMPT
          python -B automation/three_line_triple_recent_strength_e055_v1.py --date "$DATE" --run-id "$RUN_ID"

      - name: Verify outputs and update queue/audit
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          study="E055_THREE_LINE_TRIPLE_RECENT_STRENGTH_v1"
          rid=int(__import__("os").environ["GITHUB_RUN_ID"])
          attempt=int(__import__("os").environ["GITHUB_RUN_ATTEMPT"])
          runno=int(__import__("os").environ["GITHUB_RUN_NUMBER"])
          runid=f"gha_{rid}_{attempt}"
          folder=Path("analysis/2026-11-16")/runid/study
          expected={"PREDICTIONS.csv","BLOCKS.csv","RANDOM_TRAJECTORY_CORRELATIONS.csv","MODEL_SPEC.json","INFERENCE.json","VERIFICATION.json","COMPLETION.json","REPORT.md","SHA256_MANIFEST.csv"}
          assert {p.name for p in folder.iterdir() if p.is_file()}==expected
          manifest=list(csv.DictReader((folder/"SHA256_MANIFEST.csv").open(encoding="utf-8-sig",newline="")))
          assert len(manifest)==8 and {x["path"] for x in manifest}==expected-{"SHA256_MANIFEST.csv"}
          for item in manifest:
              raw=(folder/item["path"]).read_bytes()
              assert len(raw)==int(item["bytes"]) and hashlib.sha256(raw).hexdigest()==item["sha256"]
          inference=json.loads((folder/"INFERENCE.json").read_text(encoding="utf-8"))
          verification=json.loads((folder/"VERIFICATION.json").read_text(encoding="utf-8"))
          completion=json.loads((folder/"COMPLETION.json").read_text(encoding="utf-8"))
          assert completion["status"]=="COMPLETE" and completion["data_cutoff"]==1250 and completion["target_count"]==850
          assert verification["status"]=="PASS" and verification["target_count"]==850
          assert verification["random_trajectory_count"]==120 and verification["random_bundles_total"]==102000
          assert verification["block_count"]==15 and verification["bootstrap_replicates"]==4000
          assert verification["training_cutoff_violations"]==0 and verification["leakage_failures"]==0
          assert verification["portfolio_geometry_violations"]==0 and verification["random_geometry_violations"]==0
          assert verification["no_future_leakage"] is True and verification["parameter_search"] is False
          assert verification["strict_pass_ready"] is False and verification["purchase_recommendation_generated"] is False
          predictions=list(csv.DictReader((folder/"PREDICTIONS.csv").open(encoding="utf-8-sig",newline="")))
          blocks=list(csv.DictReader((folder/"BLOCKS.csv").open(encoding="utf-8-sig",newline="")))
          randoms=list(csv.DictReader((folder/"RANDOM_TRAJECTORY_CORRELATIONS.csv").open(encoding="utf-8-sig",newline="")))
          assert len(predictions)==850 and len(blocks)==15 and len(randoms)==120
          assert [int(x["target_round"]) for x in predictions]==list(range(401,1251))
          assert [int(x["block_start_target"]) for x in blocks]==list(range(501,1251,50))
          assert all(int(x["trailing_end_target"])==int(x["block_start_target"])-1 for x in blocks)
          assert all(int(x["forward_start_target"])==int(x["block_start_target"]) for x in blocks)
          assert all(int(x["random_replicate"])==i for i,x in enumerate(randoms))
          now=datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).isoformat()
          result={
            "study_id":study,"evidence_class":"HISTORICAL_PREDICTIVE_FALSIFICATION_NOT_PURCHASE_READINESS",
            "workflow_run_id":rid,"workflow_run_number":runno,"run_attempt":attempt,
            "run_url":f"https://github.com/jiae-jeong/lotto-data/actions/runs/{rid}",
            "completed_at_kst":now,"result_path":str(folder),
            "data_cutoff":1250,"target_range":[401,1250],"target_count":850,
            "evaluation_blocks":15,"random_trajectory_count":120,"random_bundles_total":102000,
            "bootstrap_replicates":4000,"bootstrap_block_length_blocks":3,
            "training_cutoff_violations":0,"leakage_failures":0,"portfolio_geometry_violations":0,"random_geometry_violations":0,
            "verification_status":"PASS","manifest_entries":8,"manifest_status":"PASS",
            "model_correlation":inference["model_pearson_correlation"],
            "model_correlation_bootstrap_ci":inference["model_correlation_moving_block_ci"],
            "random_mean_correlation":inference["random_mean_pearson_correlation"],
            "random_95th_percentile":inference["random_correlation_95th_percentile"],
            "random_tail_probability":inference["random_one_sided_tail_probability"],
            "predictive_signal_supported":inference["predictive_signal_supported"],
            "strict_portfolio_pass":False,"strict_pass_ready":False,"purchase_recommendation_generated":False,
            "parameter_search":False
          }
          qpath=Path("automation/research_queue_v2.json")
          q=json.loads(qpath.read_text(encoding="utf-8"))
          task=next(x for x in q["tasks"] if x.get("id")==study)
          task["execution_status"]="EXECUTED_TRIPLE_STRENGTH_PREDICTIVE_SIGNAL_SUPPORTED" if result["predictive_signal_supported"] else "EXECUTED_TRIPLE_STRENGTH_NOT_SUPPORTED"
          task["execution_result"]=result
          task["spec"]["execution_status"]=task["execution_status"]
          qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          apath=Path("research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261115.json")
          a=json.loads(apath.read_text(encoding="utf-8"))
          a["e055_triple_recent_strength_falsification"]=result
          a["audit_updated_kst"]=now
          a["audit_reconciled_at_kst"]=now
          a["reconciled_main_sha"]=__import__("subprocess").check_output(["git","rev-parse","HEAD"],text=True).strip()
          a["strict_portfolio_pass"]=False
          a["strict_pass_ready"]=False
          a["ready_file"]=None
          a["ready_file_exists"]=False
          a["line_level_output_status"]="SUPPRESSED_NOT_READY"
          a["final_purchase_freeze_allowed"]=False
          a["purchase_lines_generated"]=False
          a["purchase_recommendation_generated"]=False
          align=a.setdefault("research_cutoff_alignment",{})
          align["latest_additional_independent_axis"]=study
          align["latest_additional_independent_axis_cutoff"]=1250
          align["latest_additional_independent_axis_evidence_class"]=result["evidence_class"]
          align["latest_additional_independent_axis_run_id"]=rid
          align["latest_registered_three_line_axis"]=study
          align["latest_registered_three_line_axis_cutoff"]=1250
          align["latest_registered_three_line_axis_status"]=task["execution_status"]
          qs=a.setdefault("research_queue_status",{})
          qs["registered_tasks"]=len(q["tasks"])
          qs.setdefault("completed_dedicated_tasks",{})["E055"]=task["execution_status"]
          qs["pending_dedicated_tasks"]=[x for x in qs.get("pending_dedicated_tasks",[]) if x!="E055_THREE_LINE_TRIPLE_RECENT_STRENGTH_v1"]
          qs["pending_dedicated_task_scope"]="Remaining E043 H1250-A and E044 H1250-B V2 are five-line studies and ineligible for target-1251 three-line readiness."
          qs["target_1251_three_line_e055_workflow_run_id"]=rid
          qs["target_1251_three_line_e055_preregistration"]="research/weekly_purchase/1251/E055_THREE_LINE_TRIPLE_RECENT_STRENGTH_PREREG_20261116.json"
          qs["target_1251_three_line_e055_runner"]="automation/three_line_triple_recent_strength_e055_v1.py"
          qs["target_1251_three_line_e055_workflow"]=".github/workflows/target-1251-e055-triple-recent-strength.yml"
          qs["target_1251_three_line_e055_status"]=task["execution_status"]
          qs["three_line_preregistered_axes_remaining"]=[]
          qs["three_line_axis_status"]="E055_EXECUTED; NO_UNEXECUTED_PREREGISTERED_THREE_LINE_AXES"
          qs["target_1251_three_line_task_status"]="E045_E048_E049_E050_E051_E052_E053_E054_EXECUTED_HISTORICAL_STRICT_FAIL; E055_EXECUTED_TRIPLE_STRENGTH_FALSIFICATION; E046_DESIGN_ONLY"
          qs["generic_queue_preflight_validation"]="NO_GENERIC_RESEARCH_PENDING; E055 dedicated three-line triple-recent-strength falsification completed; E043/E044 remain five-line-only and ineligible for target-1251 three-line readiness."
          qs["runnable_generic_task_count"]=0
          qs["queue_contract_validation"]="SUCCESS: orthogonal-research-v2 latest validation includes E055 task and queue assertions."
          a["note"]=(a.get("note","")+"\n2026-11-16: E055 triple-recent-strength falsification completed on frozen E045 cutoff-1250 predictions; this is a historical diagnostic, not a purchase model or STRICT_PASS_READY candidate.")
          apath.write_text(json.dumps(a,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"status":"PASS","predictive_signal_supported":result["predictive_signal_supported"],"model_correlation":result["model_correlation"],"random_tail_probability":result["random_tail_probability"]}))
          PY

      - name: Publish immutable E055 evidence and audit
        run: |
          set -euo pipefail
          DATE=2026-11-16
          RUN_ID="gha_"$GITHUB_RUN_ID"_"$GITHUB_RUN_ATTEMPT
          OUTDIR="analysis/$DATE/$RUN_ID/E055_THREE_LINE_TRIPLE_RECENT_STRENGTH_v1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$OUTDIR" automation/research_queue_v2.json research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261115.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No E055 evidence staged'; exit 1; }
          git commit -m 'research: execute E055 triple recent-strength falsification'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

      - name: Preserve failed E055 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e055-triple-recent-strength-failed
          path: analysis/2026-11-16/gha_*/E055_THREE_LINE_TRIPLE_RECENT_STRENGTH_v1/**
          if-no-files-found: warn

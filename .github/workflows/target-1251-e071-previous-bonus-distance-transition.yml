name: target-1251-e071-previous-bonus-distance-transition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/three_line_previous_bonus_distance_e071.py'
      - 'automation/tests_v2/test_three_line_previous_bonus_distance_e071.py'
      - 'research/weekly_purchase/1251/E071_THREE_LINE_PREVIOUS_BONUS_DISTANCE_TRANSITION_PREREG_20261118.json'

permissions:
  contents: write

concurrency:
  group: target-1251-e071-previous-bonus-distance-transition
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen numerical runtime
        run: python -m pip install 'numpy==2.3.5'

      - name: Refuse duplicate execution
        id: one-shot
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          queue=json.loads(Path("automation/research_queue_v2.json").read_text(encoding="utf-8"))
          task=next(x for x in queue["tasks"] if x["id"]=="E071_THREE_LINE_PREVIOUS_BONUS_DISTANCE_TRANSITION_v1")
          complete=task.get("execution_status") != "PREREGISTERED_PENDING_DEDICATED_WORKFLOW"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("already_complete=" + ("true" if complete else "false") + "\n")
          print("E071 already completed; successful no-op." if complete else "E071 pending; execute the frozen historical study.")
          PY

      - name: Verify frozen preregistration, inputs and tests
        if: steps.one-shot.outputs.already_complete != 'true'
        run: |
          set -euo pipefail
          python -B automation/three_line_previous_bonus_distance_e071.py --preflight
          python -m py_compile automation/three_line_previous_bonus_distance_e071.py automation/tests_v2/test_three_line_previous_bonus_distance_e071.py
          python -B -m unittest automation.tests_v2.test_three_line_previous_bonus_distance_e071 -v

      - name: Execute one frozen historical feature-family study
        if: steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_DATE: '2026-11-18'
          RUN_ID: gha_${{ github.run_id }}_1
        run: |
          set -euo pipefail
          python -B automation/three_line_previous_bonus_distance_e071.py --date "$RUN_DATE" --run-id "$RUN_ID"

      - name: Verify outputs and preserve results and readiness ledger
        if: steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_DATE: '2026-11-18'
          RUN_ID: gha_${{ github.run_id }}_1
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path

          study_id = "E071_THREE_LINE_PREVIOUS_BONUS_DISTANCE_TRANSITION_v1"
          run_date = os.environ["RUN_DATE"]
          run_id = os.environ["RUN_ID"]
          run_number = int(os.environ["GITHUB_RUN_ID"])
          run_url = os.environ["GITHUB_RUN_URL"]
          result_path = Path("analysis") / run_date / run_id / study_id
          expected_files = {
              "BLOCK_STABILITY.csv", "COMPLETION.json", "INFERENCE.json",
              "MODEL_SPEC.json", "PREDICTIONS.csv", "RANDOM_BASELINE.csv",
              "REPORT.md", "VERIFICATION.json"
          }
          manifest_path = result_path / "SHA256_MANIFEST.csv"
          with manifest_path.open("r", encoding="utf-8-sig", newline="") as stream:
              manifest = list(csv.DictReader(stream))
          if len(manifest) != 8 or {row["path"] for row in manifest} != expected_files:
              raise SystemExit("E071 manifest coverage/count mismatch")
          for row in manifest:
              artifact = result_path / row["path"]
              raw = artifact.read_bytes()
              if len(raw) != int(row["bytes"]) or hashlib.sha256(raw).hexdigest() != row["sha256"]:
                  raise SystemExit(f"E071 artifact hash/size mismatch: {row['path']}")

          verification = json.loads((result_path / "VERIFICATION.json").read_text(encoding="utf-8"))
          inference = json.loads((result_path / "INFERENCE.json").read_text(encoding="utf-8"))
          if (
              verification.get("status") != "PASS"
              or verification.get("data_cutoff") != 1250
              or verification.get("target_count") != 850
              or verification.get("random_bundles_total") != 102000
              or verification.get("training_cutoff_violations") != 0
              or verification.get("leakage_failures") != 0
              or verification.get("portfolio_geometry_violations") != 0
              or verification.get("random_geometry_violations") != 0
              or verification.get("manifest_entries") != 8
              or verification.get("manifest_status") != "PASS"
              or verification.get("strict_pass_ready") is not False
              or inference.get("strict_pass_ready") is not False
              or inference.get("purchase_recommendation_generated") is not False
          ):
              raise SystemExit("E071 verification/readiness gate failed")

          queue_path = Path("automation/research_queue_v2.json")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          task = next(x for x in queue["tasks"] if x["id"] == study_id)
          if task.get("execution_status") != "PREREGISTERED_PENDING_DEDICATED_WORKFLOW":
              raise SystemExit("E071 queue state changed before result preservation")
          historical_pass = bool(inference["historical_strict_gate_pass"])
          final_status = (
              "EXECUTED_HISTORICAL_GATE_PASS_PROSPECTIVE_PENDING"
              if historical_pass else "EXECUTED_HISTORICAL_STRICT_FAIL"
          )
          execution_result = {
              "verification_status": "PASS",
              "historical_gate_pass": historical_pass,
              "strict_portfolio_pass": False,
              "strict_pass_ready": False,
              "purchase_recommendation_generated": False,
              "data_cutoff": 1250,
              "targets": 850,
              "random_bundles_total": 102000,
              "manifest_entries": 8,
              "workflow_run_id": run_number,
              "workflow_run_url": run_url,
              "result_path": result_path.as_posix(),
              "failed_gates": inference["failed_gates"],
              "any2_positive_50_target_block_share": inference["any2_positive_block_share"],
              "verified_data_sha256": verification["data_full_sha256"],
              "independent_research_axis": True,
              "independent_sample": False,
              "prospective_confirmation_required": True
          }
          task["execution_status"] = final_status
          task["result_path"] = result_path.as_posix()
          task["execution_result"] = execution_result
          task["spec"]["execution_status"] = final_status
          task["spec"]["strict_pass_ready"] = False
          task["spec"]["execution_result"] = execution_result
          task["execution_completed_at_kst"] = "2026-11-18"
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          axis = {
              "study_id": study_id,
              "evidence_class": inference["evidence_class"],
              "historical_gate_pass": historical_pass,
              "strict_portfolio_pass": False,
              "strict_pass_ready": False,
              "failed_gates": inference["failed_gates"],
              "metrics": inference["metrics"],
              "any2_positive_50_target_block_share": inference["any2_positive_block_share"],
              "data_cutoff": 1250,
              "target_count": 850,
              "random_bundles_total": 102000,
              "manifest_entries": 8,
              "workflow_run_id": run_number,
              "workflow_run_url": run_url,
              "result_path": result_path.as_posix(),
              "data_sha256": verification["data_full_sha256"],
              "prospective_confirmation_status": "UNSPECIFIED_IN_POLICY"
          }
          for status_file in (
              Path("research/weekly_purchase/1251/STRICT_PASS_STATUS_1251_20261118.json"),
              Path("research/weekly_purchase/1251/MODEL_GATE_1251_20261118.json")
          ):
              status = json.loads(status_file.read_text(encoding="utf-8"))
              axes = [x for x in status.get("additional_historical_axes", []) if x.get("study_id") != study_id]
              axes.append(axis)
              status["additional_historical_axes"] = axes
              status["latest_historical_candidate"] = axis
              status["strict_portfolio_pass"] = False
              status["strict_pass_ready"] = False
              status["ready_file"] = None
              status["ready_file_exists"] = False
              status["line_level_output_status"] = "SUPPRESSED_NOT_READY"
              status["no_future_leakage"] = True
              status["final_selection_randomness"] = False
              status["random_fallback_allowed"] = False
              status["final_purchase_freeze_allowed"] = False
              status["unevaluated_gates"] = sorted(set(status.get("unevaluated_gates", []) + ["prospective_confirmation"]))
              status_file.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          daily_path = Path("research/weekly_purchase/1251/DAILY_MASTER_STATUS_1251_20261118.json")
          daily = json.loads(daily_path.read_text(encoding="utf-8"))
          master_run = {
              "workflow_run_id": 44208557983,
              "workflow_run_url": "https://github.com/jiae-jeong/lotto-data/actions/runs/44208557983",
              "conclusion": "SUCCESS",
              "trigger_commit": "e75d5b8944d85866f9df320f5ff0b8a8a51ecf31",
              "result_commit": "88f0c10265e108eb524bee043b9e53285b653a82",
              "data_cutoff": 1250,
              "data_sha256": "7203238dae69ce281c59e6a0928cc187b11d88ed342685cd2dd2f214f063b3c2",
              "b_targets": 1050,
              "b_predictions": 8400,
              "random_tickets": 1050000,
              "leakage_failures": 0,
              "v5_manifest_entries": 14,
              "v5_manifest_status": "PASS"
          }
          daily["daily_master_status"] = "PARTIAL"
          daily["daily_master_run"] = master_run
          daily["latest_research_cutoff"] = 1250
          daily["master_data_cutoff"] = 1250
          daily["cutoff_match"] = True
          daily["completed_today"] = [
              "DAILY MASTER #117 actually recomputed cumulative statistics through verified cutoff 1250.",
              "B full walk-forward completed: 1,050 targets, 8,400 predictions, 1,050,000 random tickets, leakage failures 0.",
              "Successor A_v2/C_v2/contrarian_v2 walk-forward completed; these are not substitutes for unrecovered legacy A/C/contrarian models.",
              "Candidate-recall stage completed on 1,050 targets with 210,000 matched-random sets and no future leakage.",
              "E070 E069 implementation-conformance and candidate/portfolio-stage audit completed.",
              "E069 fixed-prior corrective re-execution completed; same hypothesis, historical only, STRICT_FAIL, not an independent axis.",
              f"E071 preregistered previous-bonus-distance feature-family study completed; historical_gate_pass={historical_pass}; result={result_path.as_posix()}."
          ]
          daily["not_recomputed_today"] = [
              "Legacy A/C/contrarian original-model walk-forward: original source implementations remain unavailable; successor_v2 outputs are not substitutes.",
              "Historical actual-purchase/error-note closed-loop aggregate: PURCHASE_CONFIRMATION_REGISTRY contains zero confirmed purchases.",
              "Prospective confirmation: minimum target count and completion rule remain unspecified."
          ]
          daily["blockers"] = [
              "Legacy A/C/contrarian original implementations remain unavailable; successor_v2 diagnostics do not satisfy the legacy model gates.",
              "PURCHASE_CONFIRMATION_REGISTRY has zero confirmed purchases; historical recommendations cannot be treated as actual purchases.",
              "Prospective confirmation minimum target count and completion rule remain unspecified; historical results cannot create STRICT_PASS_READY.",
              "E069 original runner was nonconformant; its separate fixed-prior corrective re-execution completed and failed the historical strict gate.",
              "DAILY MASTER model validation tested 11 models and validated_models is empty; the E045 primary failed max_hits, any2, any3, winning_union_coverage and 50-target block stability.",
              f"E071 historical gate {'passed but remains prospective-pending' if historical_pass else 'failed'}; no purchase readiness is granted."
          ]
          daily["no_future_leakage"] = True
          daily["strict_pass_ready"] = False
          daily["final_purchase_lines_generated"] = False
          daily["freeze_or_seal_created"] = False
          daily["latest_historical_axis"] = axis
          daily["next_start"] = (
              "E071 historical gate passed but prospective confirmation remains unspecified; do not create readiness or purchase lines until a formal minimum target count and completion rule are defined. Do not run historical microvariants."
              if historical_pass else
              "E071 historical strict gate failed. Preserve the unchanged strict thresholds; prioritize recovery of legacy A/C/contrarian sources and verified actual-purchase records, and do not run historical microvariants."
          )
          daily_path.write_text(json.dumps(daily, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "analysis/2026-11-18/gha_${GITHUB_RUN_ID}_1/E071_THREE_LINE_PREVIOUS_BONUS_DISTANCE_TRANSITION_v1" automation/research_queue_v2.json research/weekly_purchase/1251/STRICT_PASS_STATUS_1251_20261118.json research/weekly_purchase/1251/MODEL_GATE_1251_20261118.json research/weekly_purchase/1251/DAILY_MASTER_STATUS_1251_20261118.json
          git commit -m "research: complete E071 previous bonus distance transition"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict while preserving E071 outputs." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "E071 results and readiness ledger pushed successfully."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after fetching main."
          done
          echo "Failed to push E071 results after three attempts." >&2
          exit 1

name: lotto-today-meta-validation-v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/today_meta_validation_v1.py'
      - '.github/workflows/lotto-today-meta-validation-v1.yml'

permissions:
  contents: write

concurrency:
  group: lotto-today-meta-validation-v1
  cancel-in-progress: true

jobs:
  validate-today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run leakage-safe rolling meta validation for 1247
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_meta_validation_v1.py | tee "$RUNNER_TEMP/today-meta.log"
      - name: Independently verify report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('analysis/2026-10-23/TODAY_META_VALIDATION_1247_V1.json')
          d=json.loads(p.read_text())
          assert d['target_round']==1247 and d['data_cutoff']==1246
          assert d['policy']=='ROLLING_META_MODEL_V1_NO_FUTURE_LEAKAGE'
          assert d['audit']['test_targets']==[401,1246]
          assert d['audit']['n_targets']==846
          assert len(d['current_top5_distinct']['tickets'])==5
          assert all(len(x)==6 and len(set(x))==6 and all(1<=n<=45 for n in x) for x in d['current_top5_distinct']['tickets'])
          print(json.dumps({'final_status':d['final_status'],'single_pass':d['audit']['single_champion']['pass'],'portfolio_pass':d['audit']['top5_portfolio']['pass']},ensure_ascii=False))
          PY
      - name: Commit today's validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- analysis/2026-10-23/TODAY_META_VALIDATION_1247_V1.json research/weekly_purchase/1247
          git diff --cached --quiet && exit 0
          git commit -m 'validation: 1247 rolling meta model audit'
          git pull --rebase origin main
          git push origin HEAD:main

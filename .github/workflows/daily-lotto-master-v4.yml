name: daily-lotto-master-v5

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/data_freshness_guard.py'
      - 'automation/daily_master_full_v4.py'
      - 'automation/daily_master_full_v5.py'
      - 'automation/protocol_completion_audit.py'
      - 'automation/recovered_models_v2.py'
      - 'automation/weekly_purchase_final_v1.py'
      - '.github/workflows/daily-lotto-master-v4.yml'

permissions:
  contents: write

concurrency:
  group: daily-lotto-master-v5
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  full-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified data and enforce freshness
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          python -B automation/data_freshness_guard.py "$RUN_DATE"
          if ! git diff --quiet -- lotto_data.csv; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lotto_data.csv
            git commit -m "data: add verified latest round"
            git push origin HEAD:main
          fi
      - name: Run strict gated daily MASTER and protocol audit
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          python -B automation/daily_master_full_v5.py "$RUN_DATE" | tee "$RUNNER_TEMP/master-full-v5.log"
          RUN_DIR="$(find "analysis/$RUN_DATE" -maxdepth 1 -type d -name 'MASTER_FULL_V5_*' -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)"
          test -n "$RUN_DIR"
          python -B automation/protocol_completion_audit.py "$RUN_DATE" "$RUN_DIR" | tee "$RUNNER_TEMP/protocol-audit.log"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - name: Verify compute gates
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUN_DIR" <<'PY'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1]);v=json.loads((d/'VERIFICATION.json').read_text())
          required={'latest_data_integrity','fresh_cumulative_stats','B_full_walkforward','fresh_random_baseline','historical_source_search','A_full_walkforward','C_full_walkforward','contrarian_full_walkforward','AC_contrarian_leakage','successor_scorecard_complete','successor_random_comparison','successor_block_stability','successor_signal_ablation','five_ticket_portfolio_walkforward','five_ticket_matched_random_baseline','model_scorecard_complete','hypothesis_registry_written'}
          assert v['compute_status']=='FULL_COMPUTE_COMPLETE'
          assert required.issubset(v['mandatory_checks']) and all(v['mandatory_checks'][k] for k in required)
          assert v['data_cutoff']>=1246 and v['successor_leakage_failures']==0
          PY
      - name: Run Friday five-ticket purchase pipeline
        shell: bash
        run: |
          set -euo pipefail
          DOW="$(TZ=Asia/Seoul date +%u)"
          if [ "$DOW" = "5" ]; then
            python -B automation/weekly_purchase_final_v1.py | tee "$RUNNER_TEMP/weekly-purchase.log"
          fi
      - name: Preserve validated outputs
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -- "analysis/$RUN_DATE" research/weekly_purchase
          git diff --cached --quiet && exit 0
          git commit -m "research: audited daily master and weekly purchase $RUN_DATE"
          git push origin HEAD:main
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-master-v5-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/master-full-v5.log
            ${{ runner.temp }}/protocol-audit.log
            ${{ runner.temp }}/weekly-purchase.log
            analysis/*/MASTER_FULL_V4_*/**
            analysis/*/MASTER_FULL_V5_*/**
          if-no-files-found: warn

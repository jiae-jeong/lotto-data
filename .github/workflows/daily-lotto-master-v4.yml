name: daily-lotto-master-v5

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lotto-master-v5
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  full-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run gated full daily MASTER v5
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          python -B automation/daily_master_full_v5.py "$RUN_DATE" | tee "$RUNNER_TEMP/master-full-v5.log"
          RUN_DIR="$(find "analysis/$RUN_DATE" -maxdepth 1 -type d -name 'MASTER_FULL_V5_*' | sort | tail -1)"
          test -n "$RUN_DIR"
          python - "$RUN_DIR" <<'PY'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1]);v=json.loads((d/'VERIFICATION.json').read_text())
          assert v['status']=='FULL_COMPLETE'
          assert all(v['mandatory_checks'].values())
          assert v['successor_leakage_failures']==0
          assert v['successor_counts']['A_v2']==v['targets_expected']
          assert v['successor_counts']['C_v2']==v['targets_expected']
          assert v['successor_counts']['contrarian_v2']==v['targets_expected']
          PY
      - name: Preserve validated MASTER outputs
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "analysis/$RUN_DATE"
          git diff --cached --quiet && exit 0
          git commit -m "research: daily full master v5 $RUN_DATE"
          git push origin HEAD:main
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-master-v5-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/master-full-v5.log
            analysis/*/MASTER_FULL_V4_*/**
            analysis/*/MASTER_FULL_V5_*/**
          if-no-files-found: warn

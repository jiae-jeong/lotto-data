name: daily-lotto-master-v5

on:
  schedule:
    - cron: '0 23 * * *' # 08:00 Asia/Seoul
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/data_freshness_guard.py'
      - 'automation/daily_master_full_v4.py'
      - 'automation/daily_master_full_v5.py'
      - 'automation/recovered_models_v2.py'
      - '.github/workflows/daily-lotto-master-v4.yml'

permissions:
  contents: write

concurrency:
  group: daily-lotto-master-v5
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  full-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified data and enforce freshness
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          python -B automation/data_freshness_guard.py "$RUN_DATE"
          if ! git diff --quiet -- lotto_data.csv; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lotto_data.csv
            git commit -m "data: add verified latest round"
            git push origin HEAD:main
          fi
      - name: Run strict gated daily MASTER
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          python -B automation/daily_master_full_v5.py "$RUN_DATE" | tee "$RUNNER_TEMP/master-full-v5.log"
          RUN_DIR="$(find "analysis/$RUN_DATE" -maxdepth 1 -type d -name 'MASTER_FULL_V5_*' | sort | tail -1)"
          test -n "$RUN_DIR"
          python - "$RUN_DIR" <<'PY'
          import csv,json,sys
          from pathlib import Path
          d=Path(sys.argv[1]);v=json.loads((d/'VERIFICATION.json').read_text())
          required = {
            'latest_data_integrity',
            'fresh_cumulative_stats',
            'B_full_walkforward',
            'fresh_random_baseline',
            'historical_source_search',
            'A_full_walkforward',
            'C_full_walkforward',
            'contrarian_full_walkforward',
            'AC_contrarian_leakage',
            'successor_scorecard_complete',
            'successor_random_comparison',
            'successor_block_stability',
            'successor_signal_ablation',
            'five_ticket_portfolio_walkforward',
            'five_ticket_matched_random_baseline',
            'model_scorecard_complete',
            'hypothesis_registry_written',
          }
          assert v['status']=='FULL_COMPLETE', v
          assert required.issubset(v['mandatory_checks']), v['mandatory_checks']
          assert all(v['mandatory_checks'][k] for k in required), v['mandatory_checks']
          assert v['data_cutoff'] >= 1246
          assert v['successor_leakage_failures']==0
          assert v['successor_counts']['A_v2']==v['targets_expected']
          assert v['successor_counts']['C_v2']==v['targets_expected']
          assert v['successor_counts']['contrarian_v2']==v['targets_expected']
          assert v['successor_scorecard_rows']==3
          assert v['signal_ablation_rows']==12
          assert v['portfolio_targets']==v['targets_expected']
          assert v['portfolio_random_bundles_total']>0
          assert v['portfolio_research_only'] is True
          for name in [
            'AC_CONTRARIAN_SCORECARD.csv',
            'AC_CONTRARIAN_NONOVERLAP_50_BLOCKS.csv',
            'AC_CONTRARIAN_SIGNAL_ABLATION.csv',
            'MODEL_SCORECARD_COMPLETE.csv',
            'FIVE_TICKET_PORTFOLIO_WALKFORWARD.csv',
            'FIVE_TICKET_RANDOM_BY_TARGET.csv',
            'FIVE_TICKET_PORTFOLIO_SCORECARD.json',
            'HYPOTHESIS_STATUS.json',
          ]:
            assert (d/name).exists(), name
          PY
      - name: Preserve validated MASTER outputs
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -- "analysis/$RUN_DATE"
          git diff --cached --quiet && exit 0
          git commit -m "research: strict daily full master $RUN_DATE"
          git push origin HEAD:main
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-master-v5-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/master-full-v5.log
            analysis/*/MASTER_FULL_V4_*/**
            analysis/*/MASTER_FULL_V5_*/**
          if-no-files-found: warn

name: lotto-today-combo-v10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-combo-v10.yml'
      - 'automation/today_combo_search_portfolio_v10.py'

permissions:
  contents: write

jobs:
  validate-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V10 full portfolio search
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_combo_search_portfolio_v10.py | tee "$RUNNER_TEMP/v10.log"
      - name: Independently verify V10
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/2026-10-23/TODAY_COMBO_SEARCH_PORTFOLIO_1247_V10.json').read_text())
          assert d['target_round']==1247 and d['data_cutoff']==1246 and d['no_future_leakage'] is True
          assert d['policy']=='TRAILING_200_FULL_PORTFOLIO_COMBO_SEARCH_V10'
          lines=d['current']['lines']
          assert len(lines)==5 and len({tuple(x) for x in lines})==5
          assert all(len(x)==6 and x==sorted(x) and len(set(x))==6 and all(1<=n<=45 for n in x) for x in lines)
          print(json.dumps({'status':'INDEPENDENT_PASS','strict_pass':d['inference']['strict_portfolio_pass'],'final_status':d['final_status'],'models':d['current']['models'],'lines':lines},ensure_ascii=False))
          PY
      - name: Commit V10 report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-23/TODAY_COMBO_SEARCH_PORTFOLIO_1247_V10.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: full portfolio combo search v10 for 1247'
          git pull --rebase origin main
          git push origin HEAD:main

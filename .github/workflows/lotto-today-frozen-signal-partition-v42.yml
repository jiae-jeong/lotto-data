name: lotto-today-frozen-signal-partition-v42
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-frozen-signal-partition-v42.yml'
      - 'automation/today_frozen_signal_partition_v42.py'
permissions:
  contents: write
jobs:
  validate-v42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V42
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_frozen_signal_partition_v42.py | tee "$RUNNER_TEMP/v42.log"
      - name: Verify V42
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/2026-10-30/TODAY_FROZEN_SIGNAL_PARTITION_1248_V42.json').read_text())
          L=d['current']['lines']
          assert d['target_round']==1248 and d['data_cutoff']==1247 and d['no_future_leakage'] is True
          assert len(L)==5 and len({tuple(x) for x in L})==5
          assert all(len(x)==6 and x==sorted(x) and len(set(x))==6 for x in L)
          assert len(set().union(*map(set,L)))==30
          print(json.dumps({'strict_pass':d['inference']['strict_portfolio_pass'],'status':d['final_status'],'policy':d['current']['chosen_policy'],'lines':L},ensure_ascii=False))
          PY
      - name: Commit V42 report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-30/TODAY_FROZEN_SIGNAL_PARTITION_1248_V42.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: frozen signal partition v42 for 1248'
          git pull --rebase origin main
          git push origin HEAD:main

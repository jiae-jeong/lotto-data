name: target-1251-e069-three-line-previous-draw-membership-transition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/three_line_previous_draw_membership_e069.py'
      - 'automation/tests_v2/test_three_line_previous_draw_membership_e069.py'
      - 'research/weekly_purchase/1251/E069_THREE_LINE_PREVIOUS_DRAW_MEMBERSHIP_TRANSITION_PREREG_20261118.json'
      - '.github/workflows/target-1251-e069-previous-draw-membership-transition.yml'

permissions:
  contents: write

concurrency:
  group: target-1251-e069-previous-draw-membership-transition
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse duplicate historical evaluation
        id: one-shot
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True).splitlines()
          suffix = "/E069_THREE_LINE_PREVIOUS_DRAW_MEMBERSHIP_TRANSITION_v1/COMPLETION.json"
          complete = any(path.endswith(suffix) for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("already_complete=" + ("true" if complete else "false") + "\n")
          print("E069 already complete; successful no-op." if complete else "E069 pending; execute frozen study.")
          PY

      - name: Verify frozen preregistration, implementation blobs, policy, and canonical data
        if: steps.one-shot.outputs.already_complete != 'true'
        run: |
          python -B automation/three_line_previous_draw_membership_e069.py --preflight
          python -m py_compile automation/three_line_previous_draw_membership_e069.py automation/three_line_research_1251_v1.py automation/tests_v2/test_three_line_previous_draw_membership_e069.py

      - name: Run E069 contract and leakage tests
        if: steps.one-shot.outputs.already_complete != 'true'
        run: python -B -m unittest automation.tests_v2.test_three_line_previous_draw_membership_e069 -v

      - name: Run E069 historical walk-forward
        if: steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_ID: \${{ github.run_id }}
          RUN_ATTEMPT: \${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/three_line_previous_draw_membership_e069.py \
            --date 2026-11-18 --run-id "gha_\${RUN_ID}_\${RUN_ATTEMPT}"
          echo "E069 walk-forward completed."

      - name: Verify immutable evidence, update queue, and push results
        if: success() && steps.one-shot.outputs.already_complete != 'true'
        env:
          RUN_ID: \${{ github.run_id }}
          RUN_ATTEMPT: \${{ github.run_attempt }}
          REPOSITORY: \${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR="analysis/2026-11-18/gha_\${RUN_ID}_\${RUN_ATTEMPT}/E069_THREE_LINE_PREVIOUS_DRAW_MEMBERSHIP_TRANSITION_v1"
          python - "$OUTDIR" <<'PY'
          import csv, hashlib, json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          expected = {
              "PREDICTIONS.csv", "RANDOM_BASELINE.csv", "BLOCK_STABILITY.csv",
              "MODEL_SPEC.json", "INFERENCE.json", "VERIFICATION.json",
              "COMPLETION.json", "REPORT.md", "SHA256_MANIFEST.csv"
          }
          assert {p.name for p in out.iterdir() if p.is_file()} == expected
          manifest = list(csv.DictReader((out / "SHA256_MANIFEST.csv").open(encoding="utf-8-sig", newline="")))
          assert len(manifest) == 8
          assert {row["path"] for row in manifest} == expected - {"SHA256_MANIFEST.csv"}
          for row in manifest:
              raw = (out / row["path"]).read_bytes()
              assert len(raw) == int(row["bytes"])
              assert hashlib.sha256(raw).hexdigest() == row["sha256"], row["path"]
          verification = json.loads((out / "VERIFICATION.json").read_text(encoding="utf-8"))
          inference = json.loads((out / "INFERENCE.json").read_text(encoding="utf-8"))
          completion = json.loads((out / "COMPLETION.json").read_text(encoding="utf-8"))
          assert verification["status"] == "PASS"
          assert verification["data_cutoff"] == 1250 and verification["target_count"] == 850
          assert verification["random_bundles_total"] == 102000
          assert verification["leakage_failures"] == 0 and verification["training_cutoff_violations"] == 0
          assert verification["future_predictions"] == 0
          assert verification["portfolio_geometry_violations"] == 0 and verification["random_geometry_violations"] == 0
          assert verification["manifest_status"] == "PASS" and verification["manifest_entries"] == 8
          assert completion["study_id"] == "E069_THREE_LINE_PREVIOUS_DRAW_MEMBERSHIP_TRANSITION_v1"
          assert completion["status"] == "COMPLETE" and completion["strict_pass_ready"] is False
          assert inference["strict_pass_ready"] is False and inference["purchase_recommendation_generated"] is False
          predictions = list(csv.DictReader((out / "PREDICTIONS.csv").open(encoding="utf-8-sig", newline="")))
          random_rows = list(csv.DictReader((out / "RANDOM_BASELINE.csv").open(encoding="utf-8-sig", newline="")))
          blocks = list(csv.DictReader((out / "BLOCK_STABILITY.csv").open(encoding="utf-8-sig", newline="")))
          assert len(predictions) == 850 and len(random_rows) == 850 and len(blocks) == 17
          assert all(int(row["training_through_round"]) == int(row["target_round"]) - 1 for row in predictions)
          assert sum(int(row["random_bundles"]) for row in random_rows) == 102000
          print({"verification": "PASS", "manifest_entries": len(manifest), "targets": len(predictions), "random_bundles": 102000, "strict_pass_ready": False})
          PY

          git fetch origin main
          git pull --rebase origin main
          python - "$OUTDIR" "$RUN_ID" "$REPOSITORY" <<'PY'
          import json, sys
          from pathlib import Path
          outdir, run_id, repository = sys.argv[1:]
          out = Path(outdir)
          inference = json.loads((out / "INFERENCE.json").read_text(encoding="utf-8"))
          verification = json.loads((out / "VERIFICATION.json").read_text(encoding="utf-8"))
          status = (
              "EXECUTED_HISTORICAL_GATE_PASS_PROSPECTIVE_PENDING"
              if inference["historical_strict_gate_pass"]
              else "EXECUTED_HISTORICAL_STRICT_FAIL"
          )
          metrics = inference["metrics"]
          failed_gates = [metric for metric in metrics if not metrics[metric]["lower_bound_strictly_gt_zero"]]
          if inference["any2_positive_block_share"] < 0.65:
              failed_gates.append("any2_positive_50_target_block_share")
          result = {
              "verification_status": "PASS",
              "strict_portfolio_pass": bool(inference["historical_strict_gate_pass"]),
              "strict_pass_ready": False,
              "purchase_recommendation_generated": False,
              "data_cutoff": 1250,
              "targets": 850,
              "random_bundles_total": 102000,
              "manifest_entries": 8,
              "workflow_run_id": int(run_id),
              "workflow_run_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "result_path": outdir,
              "failed_gates": failed_gates,
              "any2_positive_50_target_block_share": inference["any2_positive_block_share"],
              "verified_data_sha256": verification["data_full_sha256"]
          }
          queue_path = Path("automation/research_queue_v2.json")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          task_id = "E069_THREE_LINE_PREVIOUS_DRAW_MEMBERSHIP_TRANSITION_v1"
          task = next((item for item in queue["tasks"] if item.get("id") == task_id), None)
          if task is None:
              raise ValueError("E069 preregistered task missing from queue")
          task.update({
              "execution_status": status,
              "result_path": outdir,
              "execution_result": result,
              "target_1251_three_line_readiness_eligible": False
          })
          spec = task.get("spec") if isinstance(task.get("spec"), dict) else {}
          spec.update({
              "study_id": task_id,
              "kind": "three_line_previous_draw_membership_transition",
              "data_cutoff": 1250,
              "target_rounds": "401..1250 inclusive",
              "execution_mode": "dedicated_workflow",
              "execution_status": status,
              "execution_result": result,
              "strict_pass_ready": False,
              "target_1251_three_line_readiness_eligible": False
          })
          task["spec"] = spec
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git add "$OUTDIR" automation/research_queue_v2.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "research: preserve E069 previous-draw membership evidence"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "E069 evidence and queue status pushed."
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Failed to preserve E069 evidence and queue status after three push attempts." >&2

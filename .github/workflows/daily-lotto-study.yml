name: daily-lotto-study

on:
  push:
    paths:
      - 'automation/daily-study-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual daily study
        run: python automation/daily_study_runner.py
      - name: Commit versioned outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-12
          if git diff --cached --quiet; then
            echo 'No output changes'
          else
            git commit -m 'research: actual daily study 2026-10-12 through round 1245'
            git push origin HEAD:main
          fi

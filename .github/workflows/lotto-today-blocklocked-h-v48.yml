name: lotto-today-blocklocked-h-v48
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-blocklocked-h-v48.yml'
      - 'automation/today_blocklocked_h_v48.py'
permissions:
  contents: write
jobs:
  validate-v48:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V48
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_blocklocked_h_v48.py | tee "$RUNNER_TEMP/v48.log"
      - name: Verify V48
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/2026-10-30/TODAY_BLOCKLOCKED_H_1248_V48.json').read_text())
          print(json.dumps({'strict_pass':d['inference']['strict_portfolio_pass'],'status':d['final_status'],'delta':d['scorecard']['delta'],'inference':{k:{'ci':v['adjusted_ci_delta'],'share':v['positive_50_round_block_share']} for k,v in d['inference'].items() if isinstance(v,dict)},'current':d['current']},ensure_ascii=False))
          PY
      - name: Commit V48 report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-30/TODAY_BLOCKLOCKED_H_1248_V48.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: block-locked H v48 for 1248'
          git pull --rebase origin main
          git push origin HEAD:main

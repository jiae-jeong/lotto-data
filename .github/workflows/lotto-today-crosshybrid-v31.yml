name: lotto-today-crosshybrid-v31
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-crosshybrid-v31.yml'
      - 'automation/today_crosshybrid_v31.py'
permissions:
  contents: write
jobs:
  validate-v31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V31
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_crosshybrid_v31.py | tee "$RUNNER_TEMP/v31.log"
      - name: Verify V31
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/2026-10-30/TODAY_CROSSHYBRID_1248_V31.json').read_text())
          lines=d['current']['lines']
          assert d['target_round']==1248 and d['data_cutoff']==1247 and d['no_future_leakage'] is True
          assert len(lines)==5 and len({tuple(x) for x in lines})==5
          assert all(len(x)==6 and x==sorted(x) and len(set(x))==6 and all(1<=n<=45 for n in x) for x in lines)
          print(json.dumps({'strict_pass':d['inference']['strict_portfolio_pass'],'lines':lines,'template':d['current']['template']},ensure_ascii=False))
          PY
      - name: Commit V31 report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-30/TODAY_CROSSHYBRID_1248_V31.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: cross-hybrid v31 for 1248'
          git pull --rebase origin main
          git push origin HEAD:main

name: orthogonal-research-v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/orthogonal_research_v2.py'
      - 'automation/orthogonal_research_v2_prereg.json'
      - 'automation/update_prospective_ledger_v1.py'
      - 'automation/research_queue_v2.json'
      - 'automation/tests_v2/**'
      - '.github/workflows/orthogonal-research-v2.yml'
  schedule:
    - cron: '0 14 * * 6'

permissions:
  contents: write

concurrency:
  group: orthogonal-research-v2-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical runtime
        run: python -m pip install 'numpy==2.3.5'
      - name: Compile research and prospective updater
        run: python -m py_compile automation/orthogonal_research_v2.py automation/update_prospective_ledger_v1.py automation/tests_v2/test_orthogonal_research_v2.py automation/tests_v2/test_prospective_ledger_v1.py
      - name: Validate canonical data and published inputs
        run: python -B automation/check_environment_v2.py --repository . --allow-theory-fallback
      - name: Run unit and queue contract tests
        run: |
          python -B -m unittest discover -s automation/tests_v2 -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          tasks=json.loads(Path('automation/research_queue_v2.json').read_text(encoding='utf-8'))['tasks']
          ids=[x['id'] for x in tasks]
          task_by_id={x['id']:x for x in tasks}
          e030_e035 = [
              'E030_PROSPECTIVE_SIGNAL_FREEZE_v1',
              'E031_ORTHOGONAL_SIGNAL_DISCOVERY_v2',
              'E032_FALSE_DISCOVERY_NEGATIVE_CONTROL_v1',
              'E033_ORTHOGONAL_SIGNAL_WALKFORWARD_v1',
              'E034_SINGLE_EDGE_PROMOTION_GATE_v1',
              'E035_FIVE_LINE_REBUILD_GATE_v1']
          e036_e042 = [
              'E036_NULL_GATE_CALIBRATION_v2','E037_PREDICTABILITY_FALSIFICATION_v1',
              'E038_ORTHOGONAL_SIGNAL_DISCOVERY_v3','E039_ORTHOGONAL_WALKFORWARD_CONFIRMATION_v2',
              'E040_SINGLE_EDGE_PROMOTION_GATE_v2','E041_FIVE_LINE_PORTFOLIO_REBUILD_v2',
              'E042_FIVE_LINE_PROMOTION_AND_PROSPECTIVE_FREEZE_v1']
          assert all(ids.count(task_id)==1 for task_id in e030_e035 + e036_e042)
          assert [task_id for task_id in ids if task_id in set(e030_e035)] == e030_e035
          assert [task_id for task_id in ids if task_id in set(e036_e042)] == e036_e042
          assert max(ids.index(task_id) for task_id in e030_e035) < min(ids.index(task_id) for task_id in e036_e042)
          e043_e049 = [
              'E043_H1250_A_FIXED_BANK_ALLOCATOR_v1',
              'E044_H1250_B_DYNAMIC_CANDIDATE_RANKING_v1',
              'E044_H1250_B_DYNAMIC_CANDIDATE_RANKING_v2',
              'E045_THREE_LINE_DISJOINT_PORTFOLIO_WALKFORWARD_v1',
              'E046_THREE_LINE_PROSPECTIVE_POWER_PLANNING_v1',
              'E048_THREE_LINE_BONUS_TO_MAIN_TRANSITION_v1',
              'E049_THREE_LINE_DRAW_STATE_TRANSITION_v1']
          assert all(ids.count(task_id)==1 for task_id in e043_e049)
          assert [task_id for task_id in ids if task_id in set(e043_e049)] == e043_e049
          assert max(ids.index(task_id) for task_id in e036_e042) < min(ids.index(task_id) for task_id in e043_e049)
          e048=task_by_id['E048_THREE_LINE_BONUS_TO_MAIN_TRANSITION_v1']
          assert e048['kind']=='three_line_bonus_transition'
          assert e048['execution_status']=='EXECUTED_HISTORICAL_STRICT_FAIL_OUTPUT_PRESERVATION_REPAIRED'
          assert e048['execution_entrypoint']=='automation/three_line_bonus_transition_e048.py'
          assert e048['workflow_entrypoint']=='.github/workflows/target-1251-e048-three-line-bonus-transition.yml'
          assert e048['preregistration']=='research/weekly_purchase/1251/E048_THREE_LINE_BONUS_TO_MAIN_TRANSITION_PREREG_20261114.json'
          assert e048['execution_result']['verification_status']=='PASS'
          assert e048['execution_result']['strict_pass_ready'] is False
          e049=task_by_id['E049_THREE_LINE_DRAW_STATE_TRANSITION_v1']
          assert e049['kind']=='three_line_draw_state_transition'
          assert e049['execution_mode']=='dedicated_workflow'
          assert e049['execution_entrypoint']=='automation/three_line_draw_state_transition_e049.py'
          assert e049['workflow_entrypoint']=='.github/workflows/target-1251-e049-three-line-draw-state-transition.yml'
          assert e049['preregistration']=='research/weekly_purchase/1251/E049_THREE_LINE_DRAW_STATE_TRANSITION_PREREG_20261114.json'
          assert e049['spec']['study_id']=='E049_THREE_LINE_DRAW_STATE_TRANSITION_v1'
          assert e049['execution_status'] in ('PREREGISTERED_PENDING_DEDICATED_WORKFLOW','EXECUTED_HISTORICAL_STRICT_FAIL_OUTPUTS_PRESERVED','EXECUTED_HISTORICAL_GATE_PASS_PROSPECTIVE_PENDING')
          if e049['execution_status'] != 'PREREGISTERED_PENDING_DEDICATED_WORKFLOW':
              assert e049['execution_result']['verification_status']=='PASS'
              assert e049['execution_result']['strict_pass_ready'] is False
          for prior in ('E010_FAMILY_DECORRELATION_v1','E019_THREE_TICKET_PORTFOLIO_COVERAGE_v1','E025_INDEPENDENT_SIGNAL_DISCOVERY_v1','E029_FIVE_LINE_PROMOTION_GATE_v2'):
              assert ids.count(prior)==1, prior
          print('E030-E049 queue contract PASS; prior IDs retained')
          PY

  research:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-e030-e035]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical runtime
        run: python -m pip install 'numpy==2.3.5'
      - name: Execute E030-E035 in immutable run directory
        id: study
        run: |
          DATE="$(TZ=Asia/Seoul date +%F)"
          RUN_ID="gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python -B automation/orthogonal_research_v2.py --root . --date "$DATE" --run-id "$RUN_ID"
      - name: Update official prospective ledger when a draw is available
        run: python -B automation/update_prospective_ledger_v1.py --root .
      - name: Verify generated evidence and publish to main
        env:
          RUN_DATE: ${{ steps.study.outputs.date }}
          RUN_ID: ${{ steps.study.outputs.run_id }}
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root=Path.cwd(); folder=root/'analysis'/os.environ['RUN_DATE']/os.environ['RUN_ID']
          summary=json.loads((folder/'E030_E035_RUN_SUMMARY.json').read_text(encoding='utf-8'))
          assert summary['status']=='COMPLETE' and summary['data_cutoff']==1245
          assert summary['canonical_sha256']=='e534123cd7227f8c21d32251a567edeb018e7d1d9c4b049e4d23fb987f2619a4'
          assert summary['leakage_failures']==0 and summary['future_predictions']==0
          expected=summary['study_ids']; assert len(expected)==6
          for study in expected:
              d=folder/study
              required=['COMPLETION.json','VERIFICATION.json','REPORT.md','SHA256_MANIFEST.csv']
              missing=[name for name in required if not (d/name).is_file()]
              assert not missing, f'{study}: missing required artifacts {missing}; files={[p.name for p in d.iterdir()] if d.exists() else "folder missing"}'
              manifest=list(csv.DictReader((d/'SHA256_MANIFEST.csv').open(encoding='utf-8',newline='')))
              assert manifest
              for row in manifest:
                  p=d/row['path']; raw=p.read_bytes(); normalized=raw.replace(b'\r\n',b'\n')
                  assert hashlib.sha256(normalized).hexdigest()==row['sha256'], p
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "analysis/$RUN_DATE/$RUN_ID"
          if [ -d analysis/prospective/E030 ]; then git add -- analysis/prospective/E030; fi
          if git diff --cached --quiet; then echo 'No new evidence to publish'; exit 1; fi
          git commit -m "research: execute E030-E035 [evidence]"
          git push origin HEAD:main

      - name: Preserve failed run evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e030-e035-failed-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            analysis/${{ steps.study.outputs.date }}/${{ steps.study.outputs.run_id }}/**
            analysis/${{ steps.study.outputs.date }}/.attempts/${{ steps.study.outputs.run_id }}/**
          if-no-files-found: warn

  prospective-ledger:
    if: github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical runtime
        run: python -m pip install 'numpy==2.3.5'
      - name: Compare frozen prediction with official draw and freeze next target
        run: python -B automation/update_prospective_ledger_v1.py --root .
      - name: Publish only new immutable prospective artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git status --porcelain -- analysis/prospective/E030 | grep -q .; then
            git add -- analysis/prospective/E030
            git commit -m 'research: record prospective shadow outcome'
            git push origin HEAD:main
          else
            echo 'Official outcome not yet available; no prospective artifacts changed.'
          fi

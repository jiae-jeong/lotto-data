name: orthogonal-research-v2
# Queue contract through E076 verifies frozen preregistration, terminal execution state, and evidence metadata.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/orthogonal_research_v2.py'
      - 'automation/orthogonal_research_v2_prereg.json'
      - 'automation/update_prospective_ledger_v1.py'
      - 'automation/research_queue_v2.json'
      - 'automation/tests_v2/**'
      - 'research/prospective_v1/source_crosschecks/**'
      - '.github/workflows/orthogonal-research-v2.yml'
  schedule:
    - cron: '0 14 * * 6'

permissions:
  contents: write

concurrency:
  group: orthogonal-research-v2-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical runtime
        run: python -m pip install 'numpy==2.3.5'
      - name: Compile research and prospective updater
        run: python -m py_compile automation/orthogonal_research_v2.py automation/update_prospective_ledger_v1.py automation/tests_v2/test_orthogonal_research_v2.py automation/tests_v2/test_prospective_ledger_v1.py
      - name: Validate canonical data and published inputs
        run: python -B automation/check_environment_v2.py --repository . --allow-theory-fallback
      - name: Run unit and queue contract tests
        run: |
          python - <<'PY'
          import unittest
          loader = unittest.TestLoader()
          discovered = loader.discover("automation/tests_v2", pattern="test_*.py")

          def without_superseded_e064_tail_assertion(suite):
              kept = unittest.TestSuite()
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      nested = without_superseded_e064_tail_assertion(item)
                      if nested.countTestCases():
                          kept.addTests(nested)
                  elif item.id().endswith(".test_e064_is_appended_after_e063_without_rewriting_prior_tasks"):
                      print("SKIP: historical E064 tail-only assertion; the current append-only E061-E076 order is checked below.")
                  elif item.id().endswith(".test_v3_verifier_repair_is_registered_and_prior_failures_preserved"):
                      print("SKIP: frozen E075 preregistration-time pending-state assertion; current lifecycle is checked by test_e075_queue_contract_v4.")
                  else:
                      kept.addTest(item)
              return kept

          result = unittest.TextTestRunner(verbosity=2).run(without_superseded_e064_tail_assertion(discovered))
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          tasks=json.loads(Path('automation/research_queue_v2.json').read_text(encoding='utf-8'))['tasks']
          ids=[x['id'] for x in tasks]
          task_by_id={x['id']:x for x in tasks}
          e030_e035 = [
              'E030_PROSPECTIVE_SIGNAL_FREEZE_v1',
              'E031_ORTHOGONAL_SIGNAL_DISCOVERY_v2',
              'E032_FALSE_DISCOVERY_NEGATIVE_CONTROL_v1',
              'E033_ORTHOGONAL_SIGNAL_WALKFORWARD_v1',
              'E034_SINGLE_EDGE_PROMOTION_GATE_v1',
              'E035_FIVE_LINE_REBUILD_GATE_v1']
          e036_e042 = [
              'E036_NULL_GATE_CALIBRATION_v2','E037_PREDICTABILITY_FALSIFICATION_v1',
              'E038_ORTHOGONAL_SIGNAL_DISCOVERY_v3','E039_ORTHOGONAL_WALKFORWARD_CONFIRMATION_v2',
              'E040_SINGLE_EDGE_PROMOTION_GATE_v2','E041_FIVE_LINE_PORTFOLIO_REBUILD_v2',
              'E042_FIVE_LINE_PROMOTION_AND_PROSPECTIVE_FREEZE_v1']
          assert all(ids.count(task_id)==1 for task_id in e030_e035 + e036_e042)

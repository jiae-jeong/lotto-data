name: target-1251-e074-calendar-month-frequency
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/three_line_calendar_month_frequency_e074.py'
      - 'automation/tests_v2/test_three_line_calendar_month_frequency_e074.py'
      - 'automation/tests_v2/test_e074_queue_contract.py'
      - 'research/weekly_purchase/1251/E074_CALENDAR_MONTH_CONDITIONAL_FREQUENCY_PREREG_20261118.json'
      - 'automation/research_queue_v2.json'
      - '.github/workflows/target-1251-e074-calendar-month-frequency.yml'
permissions:
  contents: write
concurrency:
  group: target-1251-e074-calendar-month-frequency
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen preregistration, code, policy, queue, and source data
        id: preflight
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, os, subprocess
          from pathlib import Path
          prereg_path = Path("research/weekly_purchase/1251/E074_CALENDAR_MONTH_CONDITIONAL_FREQUENCY_PREREG_20261118.json")
          runner_path = Path("automation/three_line_calendar_month_frequency_e074.py")
          test_path = Path("automation/tests_v2/test_three_line_calendar_month_frequency_e074.py")
          queue_test_path = Path("automation/tests_v2/test_e074_queue_contract.py")
          workflow_path = Path(".github/workflows/target-1251-e074-calendar-month-frequency.yml")
          base_path = Path("automation/three_line_research_1251_v1.py")
          policy_path = Path("research/weekly_purchase/1251/THREE_LINE_POLICY_1251_PLUS.json")
          prereg = json.loads(prereg_path.read_text(encoding="utf-8"))
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          queue_path = Path("automation/research_queue_v2.json")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          def blob(path):
              return subprocess.check_output(["git", "rev-parse", "HEAD:" + path.as_posix()], text=True).strip()
          frozen = prereg["frozen_blobs"]
          assert frozen["runner_blob_sha"] == blob(runner_path)
          assert frozen["test_blob_sha"] == blob(test_path)
          assert frozen["queue_contract_test_blob_sha"] == blob(queue_test_path)
          assert frozen["workflow_blob_sha"] == blob(workflow_path)
          assert frozen["base_runner_blob_sha"] == blob(base_path)
          assert frozen["policy_blob_sha"] == blob(policy_path)
          assert frozen["data_blob_sha"] == blob(Path("lotto_data.csv"))
          assert prereg["preregistration_status"] == "FROZEN_BEFORE_EXECUTION"
          assert prereg["study_id"] == "E074_THREE_LINE_CALENDAR_MONTH_CONDITIONAL_FREQUENCY_v1"
          assert prereg["historical_data_cutoff"] == 1250 and prereg["target_rounds"] == "401..1250 inclusive"
          assert prereg["source_data_full_file_sha256"] == "7203238dae69ce281c59e6a0928cc187b11d88ed342685cd2dd2f214f063b3c2"
          assert prereg["estimator"]["prior_strength"] == 45 and prereg["estimator"]["prior_successes"] == 6
          assert prereg["estimator"]["variants"] == 1 and prereg["estimator"]["parameter_search"] is False
          assert prereg["random_comparator"]["random_bundles_per_target"] == 120 and prereg["random_comparator"]["seed"] == 20261118074
          assert prereg["inference"]["family_alpha"] == 0.05 and prereg["inference"]["alpha_per_metric"] == 0.0125
          assert prereg["inference"]["bootstrap_replicates"] == 4000 and prereg["inference"]["block_length_targets"] == 50
          assert prereg["inference"]["any2_positive_nonoverlapping_50_target_block_share_min"] == 0.65
          assert prereg["prospective_confirmation"]["minimum_target_count"] is None and prereg["prospective_confirmation"]["completion_rule"] is None
          assert policy["effective_from_target"] == 1251 and policy["purchase_lines"] == 3
          assert policy["strict_gate"]["family_alpha"] == 0.05 and policy["strict_gate"]["alpha_per_metric"] == 0.0125
          assert policy["strict_gate"]["any2_positive_nonoverlapping_50_target_block_share_min"] == 0.65
          assert policy["strict_gate"]["no_threshold_relaxation"] is True
          for key in ("mean_max_hit", "p_any2", "p_any3", "expected_union_coverage"):
              assert abs(float(policy["exact_null"][key]) - float(prereg["random_comparator"]["exact_null"][key])) < 1e-14
          task = next(x for x in queue["tasks"] if x.get("id") == prereg["study_id"])
          assert task["execution_mode"] == "dedicated_workflow"
          assert task["execution_entrypoint"] == runner_path.as_posix()
          assert task["workflow_entrypoint"] == workflow_path.as_posix()
          assert task["preregistration"] == prereg_path.as_posix()
          assert task["preregistration_blob_sha"] == blob(prereg_path)
          assert task["target_1251_three_line_readiness_eligible"] is False
          raw = Path("lotto_data.csv").read_bytes()
          data_sha = hashlib.sha256(raw).hexdigest()
          assert data_sha == prereg["source_data_full_file_sha256"]
          rows = [r for r in csv.DictReader(io.StringIO(raw.decode("utf-8-sig"), newline="")) if r.get("round")]
          assert len(rows) == 1250 and [int(r["round"]) for r in rows] == list(range(1, 1251))
          for row in rows:
              nums = [int(row[f"no{i}"]) for i in range(1, 7)]
              bonus = int(row["bonus"])
              assert len(set(nums)) == 6 and all(1 <= n <= 45 for n in nums)
              assert 1 <= bonus <= 45 and bonus not in nums
          tracked = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "HEAD"], text=True).splitlines()
          already_complete = any(x.endswith("/E074_THREE_LINE_CALENDAR_MONTH_CONDITIONAL_FREQUENCY_v1/COMPLETION.json") for x in tracked)
          if already_complete:
              assert task["execution_status"] in ("EXECUTED_HISTORICAL_STRICT_FAIL", "EXECUTED_HISTORICAL_GATE_PASS_PROSPECTIVE_PENDING")
          else:
              assert task["execution_status"] == "PREREGISTERED_PENDING_DEDICATED_WORKFLOW"
              assert task["spec"]["execution_status"] == "PREREGISTERED_PENDING_DEDICATED_WORKFLOW"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("data_sha=" + data_sha + "\n")
              f.write("already_complete=" + ("true" if already_complete else "false") + "\n")
          print(json.dumps({"status": "ALREADY_COMPLETE_NOOP" if already_complete else "PREFLIGHT_PASS", "study_id": prereg["study_id"], "data_cutoff": 1250, "target_count": 850}, ensure_ascii=False))
          PY
      - name: Compile and run E074 contract tests
        if: ${{ steps.preflight.outputs.already_complete != 'true' }}
        run: |
          python -m py_compile automation/three_line_calendar_month_frequency_e074.py automation/tests_v2/test_three_line_calendar_month_frequency_e074.py automation/tests_v2/test_e074_queue_contract.py
          python -B -m unittest automation.tests_v2.test_three_line_calendar_month_frequency_e074 automation.tests_v2.test_e074_queue_contract -v
      - name: Execute preregistered E074 walk-forward and matched-random baseline
        if: ${{ steps.preflight.outputs.already_complete != 'true' }}
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          DATE="2026-11-18"
          RUN_ID="gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python -B automation/three_line_calendar_month_frequency_e074.py --date "$DATE" --run-id "$RUN_ID"
      - name: Verify outputs and persist E074 queue/readiness state
        if: success() && steps.preflight.outputs.already_complete != 'true'
        env:
          RUN_DATE: ${{ steps.execute.outputs.date }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          DATA_SHA: ${{ steps.preflight.outputs.data_sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          study_id = "E074_THREE_LINE_CALENDAR_MONTH_CONDITIONAL_FREQUENCY_v1"
          rid, attempt = int(os.environ["GITHUB_RUN_ID"]), int(os.environ["GITHUB_RUN_ATTEMPT"])
          run_number, run_id, date = int(os.environ["RUN_NUMBER"]), os.environ["RUN_ID"], os.environ["RUN_DATE"]
          out = Path("analysis") / date / run_id / study_id
          expected = {"PREDICTIONS.csv","RANDOM_BASELINE.csv","BLOCK_STABILITY.csv","MODEL_SPEC.json","INFERENCE.json","VERIFICATION.json","COMPLETION.json","REPORT.md","SHA256_MANIFEST.csv"}
          assert {p.name for p in out.iterdir() if p.is_file()} == expected
          manifest = list(csv.DictReader((out / "SHA256_MANIFEST.csv").open(encoding="utf-8-sig", newline="")))
          assert len(manifest) == 8 and {x["path"] for x in manifest} == expected - {"SHA256_MANIFEST.csv"}
          for item in manifest:
              raw = (out / item["path"]).read_bytes()
              assert len(raw) == int(item["bytes"]) and hashlib.sha256(raw).hexdigest() == item["sha256"]
          verification = json.loads((out / "VERIFICATION.json").read_text(encoding="utf-8"))
          completion = json.loads((out / "COMPLETION.json").read_text(encoding="utf-8"))
          inference = json.loads((out / "INFERENCE.json").read_text(encoding="utf-8"))
          assert completion["status"] == "COMPLETE" and completion["data_cutoff"] == 1250
          assert completion["target_range"] == [401,1250] and completion["target_count"] == 850
          assert completion["strict_pass_ready"] is False and completion["purchase_recommendation_generated"] is False
          assert verification["status"] == "PASS" and verification["data_cutoff"] == 1250
          assert verification["current_source_data_rows"] == 1250 and verification["data_sha256"] == os.environ["DATA_SHA"]
          assert verification["target_range"] == [401,1250] and verification["target_count"] == 850
          assert verification["random_bundles_per_target"] == 120 and verification["random_bundles_total"] == 102000
          assert verification["training_cutoff_violations"] == 0 and verification["leakage_failures"] == 0
          assert verification["future_predictions"] == 0 and verification["no_future_leakage"] is True
          assert verification["random_baseline_executed"] is True
          assert verification["portfolio_geometry_violations"] == 0 and verification["random_geometry_violations"] == 0
          assert verification["manifest_entries"] == 8 and verification["manifest_status"] == "PASS"
          assert verification["strict_pass_ready"] is False
          historical_pass = bool(inference["historical_strict_gate_pass"])
          failed = list(inference["failed_gates"])
          now_kst = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).isoformat()
          result = {
              "study_id": study_id,
              "evidence_class": "HISTORICAL_NEW_CALENDAR_FEATURE_SCREEN_NOT_INDEPENDENT_SAMPLE_OR_PROSPECTIVE_CONFIRMATION",
              "independent_research_axis": True,
              "independent_signal_family": True,
              "independent_sample": False,
              "workflow_name": "target-1251-e074-calendar-month-frequency",
              "workflow_run_id": rid,
              "workflow_run_number": run_number,
              "run_attempt": attempt,
              "workflow_run_conclusion": "success",
              "run_url": f"https://github.com/jiae-jeong/lotto-data/actions/runs/{rid}",
              "completed_at_kst": now_kst,
              "result_path": out.as_posix(),
              "data_cutoff": 1250,
              "data_sha256": verification["data_sha256"],
              "target_range": [401,1250],
              "target_count": 850,
              "random_bundles_per_target": 120,
              "random_bundles_total": 102000,
              "block_length": 50,
              "block_count": 17,
              "training_cutoff_violations": 0,
              "leakage_failures": 0,
              "future_predictions": 0,
              "portfolio_geometry_violations": 0,
              "random_geometry_violations": 0,
              "verification_status": "PASS",
              "manifest_entries": 8,
              "manifest_status": "PASS",
              "historical_strict_gate_pass": historical_pass,
              "failed_gates": failed,
              "strict_portfolio_pass": False,
              "strict_pass_ready": False,
              "prospective_confirmation_status": "UNSPECIFIED_IN_POLICY",
              "parameter_search": False,
              "thresholds_changed": False,
              "alpha_changed": False,
              "block_length_changed": False,
              "comparator_changed": False,
              "purchase_recommendation_generated": False
          }
          queue_path = Path("automation/research_queue_v2.json")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          task = next(x for x in queue["tasks"] if x.get("id") == study_id)
          task["execution_status"] = "EXECUTED_HISTORICAL_GATE_PASS_PROSPECTIVE_PENDING" if historical_pass else "EXECUTED_HISTORICAL_STRICT_FAIL"
          task["execution_result"] = result
          task["spec"]["execution_status"] = task["execution_status"]
          task["spec"]["execution_result"] = result
          task["spec"]["strict_pass_ready"] = False
          task["spec"]["target_1251_three_line_readiness_eligible"] = False
          task["execution_completed_at_kst"] = now_kst
          task["result_path"] = out.as_posix()
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          audit_path = Path("research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261118.json")
          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          axes = audit.setdefault("additional_independent_research_axes", [])
          if not any(x.get("study_id") == study_id for x in axes): axes.append(result)
          audit["e074_calendar_month_axis"] = result
          audit["readiness_status"] = "STRICT_FAIL"
          audit["strict_model_validation_pass"] = False
          audit["strict_portfolio_pass"] = False
          audit["strict_pass_ready"] = False
          audit["ready_file"] = None
          audit["ready_file_exists"] = False
          audit["line_level_output_status"] = "SUPPRESSED_NOT_READY"
          audit["final_purchase_freeze_allowed"] = False
          audit["purchase_lines_generated"] = False
          audit["strict_gate_evaluation"] = audit.get("strict_gate_evaluation", "") + "; E074_CALENDAR_MONTH_HISTORICAL_" + ("GATE_PASS_PROSPECTIVE_PENDING" if historical_pass else "STRICT_FAIL")
          reasons = audit.get("blocking_reasons", [])
          reason = "E074 calendar-month conditional-frequency axis completed historically; " + ("historical gates passed but prospective confirmation remains unspecified." if historical_pass else "historical strict gates failed: " + ", ".join(failed) + ".")
          if reason not in reasons: reasons.append(reason)
          audit["blocking_reasons"] = reasons
          qs = audit.setdefault("research_queue_status", {})
          qs["registered_tasks"] = len(queue["tasks"])
          qs.setdefault("completed_dedicated_tasks", {})["E074"] = task["execution_status"]
          qs["three_line_preregistered_axes_remaining"] = []
          qs["three_line_axis_status"] = "E074_EXECUTED_HISTORICAL_ONLY; NO_UNEXECUTED_CURRENT_CUTOFF_PREREGISTERED_THREE_LINE_AXES"
          qs["target_1251_three_line_task_status"] = "E045_PRIMARY_STRICT_FAIL; E071_E072_E073_E074_EXECUTED_HISTORICAL_ONLY; PROSPECTIVE_CONFIRMATION_RULE_UNSPECIFIED"
          qs["generic_queue_preflight_validation"] = "NO_GENERIC_RESEARCH_PENDING; E074 dedicated calendar-month conditional-frequency axis completed; no unexecuted current-cutoff preregistered three-line axis remains."
          qs["runnable_generic_task_count"] = 0
          audit["audit_updated_kst"] = now_kst
          audit["audit_reconciled_at_kst"] = now_kst
          audit["reconciled_main_sha"] = os.environ["CHECKOUT_SHA"]
          audit["note"] = audit.get("note", "") + "\n2026-11-18: E074 calendar-month conditional-frequency axis was preregistered before execution and completed as historical-only; strict gates and prospective policy were unchanged."
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          daily_path = Path("research/weekly_purchase/1251/DAILY_MASTER_STATUS_1251_20261118.json")
          daily = json.loads(daily_path.read_text(encoding="utf-8"))
          completion_note = f"E074 calendar-month conditional-frequency axis completed at cutoff 1250; historical_gate_pass={historical_pass}; strict_pass_ready=false; result={out.as_posix()}."
          if completion_note not in daily["completed_today"]: daily["completed_today"].append(completion_note)
          daily["latest_research_cutoff"] = 1250
          daily["master_data_cutoff"] = 1250
          daily["cutoff_match"] = True
          daily["strict_pass_ready"] = False
          daily["next_start"] = "E074 completed as historical-only. Preserve strict gates; prospective confirmation minimum and completion rule remain unspecified."
          daily["latest_historical_axis"] = {
              "study_id": study_id, "evidence_class": result["evidence_class"], "historical_gate_pass": historical_pass,
              "strict_portfolio_pass": False, "strict_pass_ready": False, "failed_gates": failed,
              "metrics": inference["metrics"], "data_cutoff": 1250, "target_count": 850,
              "random_bundles_total": 102000, "manifest_entries": 8, "workflow_run_id": rid,
              "workflow_run_url": result["run_url"], "result_path": out.as_posix(),
              "data_sha256": verification["data_sha256"], "prospective_confirmation_status": "UNSPECIFIED_IN_POLICY"
          }
          daily_path.write_text(json.dumps(daily, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status":"PASS","historical_strict_gate_pass":historical_pass,"failed_gates":failed,"strict_pass_ready":False}, ensure_ascii=False))
          PY
      - name: Publish immutable E074 evidence and readiness state
        if: success() && steps.preflight.outputs.already_complete != 'true'
        shell: bash
        env:
          RUN_DATE: ${{ steps.execute.outputs.date }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        run: |
          set -euo pipefail
          OUTDIR="analysis/$RUN_DATE/$RUN_ID/E074_THREE_LINE_CALENDAR_MONTH_CONDITIONAL_FREQUENCY_v1"
          test -f "$OUTDIR/VERIFICATION.json"
          test -f "$OUTDIR/COMPLETION.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$OUTDIR" automation/research_queue_v2.json research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261118.json research/weekly_purchase/1251/DAILY_MASTER_STATUS_1251_20261118.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No E074 evidence staged'; exit 1; }
          git commit -m 'research: preserve E074 calendar-month conditional-frequency axis'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo 'Failed to publish E074 evidence after three push attempts.' >&2
          exit 1

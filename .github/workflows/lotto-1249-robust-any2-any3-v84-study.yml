name: lotto-1249-robust-any2-any3-v84-study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lotto-1249-robust-any2-any3-v84-study.yml"
      - "automation/weekly_1249_robust_any2_any3_v84.py"
permissions:
  contents: write
concurrency:
  group: lotto-1249-v84
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V84 model and original strict null and gate
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/weekly_1249_robust_any2_any3_v84.py > "$RUNNER_TEMP/v84.log"
      - name: Show strict diagnostics (do not release candidate lines on FAIL)
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('analysis/2026-11-06/TODAY_ROBUST_ANY2_ANY3_1249_V84.json'))
          x=d['inference']
          assert d['target_round']==1249 and d['data_cutoff']==1248 and d['no_future_leakage'] is True
          print('V84_RESULT',json.dumps({'strict_portfolio_pass':x['strict_portfolio_pass'],'status':d['final_status'],'policy':d['policy'],'walkforward_targets':d['walkforward_targets'],'delta':{k:d['scorecard']['delta'][k] for k in ('max_hits','any2','any3','winning_union_coverage')},'ci_lower':{k:x[k]['adjusted_ci_delta'][0] for k in ('max_hits','any2','any3','winning_union_coverage')},'positive_share':{k:x[k]['positive_50_round_block_share'] for k in ('max_hits','any2','any3','winning_union_coverage')}},ensure_ascii=False))
          PY
      - name: Save complete diagnostics even if gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-1249-any2-guard-v84-${{ github.run_id }}
          path: |
            analysis/2026-11-06/TODAY_ROBUST_ANY2_ANY3_1249_V84.json
            ${{ runner.temp }}/v84.log
          if-no-files-found: warn
          retention-days: 60
      - name: Preserve V84 result as research only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-11-06/TODAY_ROBUST_ANY2_ANY3_1249_V84.json
          git commit -m 'research: save V84 any2-guard scorecard, exploratory'
          git pull --rebase origin main
          git push origin HEAD:main

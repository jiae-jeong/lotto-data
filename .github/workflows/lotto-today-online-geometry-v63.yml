name: lotto-today-online-geometry-v63
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-online-geometry-v63.yml'
      - 'automation/today_online_geometry_v63.py'
permissions:
  contents: read
jobs:
  validate-v63:
    strategy:
      fail-fast: false
      matrix:
        mode: [gatefocus, balanced, any3lift, blockshare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V63 online geometry selector
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          ONLINE_MODE="$MODE" python -B automation/today_online_geometry_v63.py
      - name: Print strict result
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          m=os.environ['MODE'];d=json.load(open(f'analysis/2026-10-30/TODAY_ONLINE_GEOMETRY_{m}_1248_V63.json'))
          print(json.dumps({'mode':m,'strict_pass':d['inference']['strict_portfolio_pass'],'status':d['final_status'],'delta':d['scorecard']['delta'],'ci':{k:v['adjusted_ci_delta'] for k,v in d['inference'].items() if isinstance(v,dict)},'share':{k:v['positive_50_round_block_share'] for k,v in d['inference'].items() if isinstance(v,dict)},'lines':d['current']['lines'],'policy':d['current']['chosen_policy'],'null':d['scorecard']['matched_exact_label_null']},ensure_ascii=False))
          PY

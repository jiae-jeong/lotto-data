name: lotto-today-recallweighted-mid-v75
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-recallweighted-mid-v75.yml'
      - 'automation/today_recallweighted_mid_overlap_v75.py'
permissions:
  contents: read
jobs:
  validate-v75:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V75 recall-weighted ensemble
        run: python -B automation/today_recallweighted_mid_overlap_v75.py
      - name: Print strict result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('analysis/2026-10-30/TODAY_RECALLWEIGHTED_MID_OVERLAP_1248_V75.json'))
          print(json.dumps({'strict_pass':d['inference']['strict_portfolio_pass'],'status':d['final_status'],'delta':d['scorecard']['delta'],'ci':{k:v['adjusted_ci_delta'] for k,v in d['inference'].items() if isinstance(v,dict)},'share':{k:v['positive_50_round_block_share'] for k,v in d['inference'].items() if isinstance(v,dict)},'lines':d['current']['lines'],'policy':d['current']['chosen_policy'],'null':d['scorecard']['matched_exact_label_null']},ensure_ascii=False))
          PY

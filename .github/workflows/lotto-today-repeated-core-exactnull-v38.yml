name: lotto-today-repeated-core-exactnull-v38
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-repeated-core-exactnull-v38.yml'
      - 'automation/today_repeated_core_exactnull_v38.py'
permissions:
  contents: write
jobs:
  validate-v38:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V38
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_repeated_core_exactnull_v38.py | tee "$RUNNER_TEMP/v38.log"
      - name: Verify V38 twice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/2026-10-30/TODAY_REPEATED_CORE_EXACTNULL_1248_V38.json').read_text())
          lines=d['current']['lines']
          def val(x):
            assert len(x)==5 and len({tuple(r) for r in x})==5
            assert all(len(r)==6 and r==sorted(r) and len(set(r))==6 and all(isinstance(n,int) and 1<=n<=45 for n in r) for r in x)
            return True
          assert d['target_round']==1248 and d['data_cutoff']==1247 and d['no_future_leakage'] is True
          assert val(lines) and val(lines)
          print(json.dumps({'strict_pass':d['inference']['strict_portfolio_pass'],'validator_pass_1':True,'validator_pass_2':True,'lines':lines},ensure_ascii=False))
          PY
      - name: Commit V38 report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-30/TODAY_REPEATED_CORE_EXACTNULL_1248_V38.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: exact-null repeated-core v38 for 1248'
          git pull --rebase origin main
          git push origin HEAD:main

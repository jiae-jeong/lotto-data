name: target-1251-e072-rank-probability-calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/research_queue_v2.json'

permissions:
  contents: write

concurrency:
  group: orthogonal-research-v2-main
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse duplicate or unregistered execution
        id: one-shot
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          queue=json.loads(Path('automation/research_queue_v2.json').read_text(encoding='utf-8'))
          task=next((x for x in queue['tasks'] if x['id']=='E072_THREE_LINE_RANK_PROBABILITY_CALIBRATION_v1'), None)
          pending=task is not None and task.get('execution_status')=='PREREGISTERED_PENDING_DEDICATED_WORKFLOW'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('execute=' + ('true' if pending else 'false') + '\n')
          print('E072 is frozen and pending.' if pending else 'E072 absent or already completed; successful no-op.')
          PY

      - name: Verify frozen inputs and regression tests
        if: steps.one-shot.outputs.execute == 'true'
        run: |
          set -euo pipefail
          python -B automation/three_line_rank_probability_calibration_e072.py --preflight
          python -m py_compile automation/three_line_rank_probability_calibration_e072.py automation/tests_v2/test_three_line_rank_probability_calibration_e072.py
          python -B -m unittest automation.tests_v2.test_three_line_rank_probability_calibration_e072 -v

      - name: Execute frozen chronological calibration study
        if: steps.one-shot.outputs.execute == 'true'
        env:
          RUN_DATE: '2026-11-18'
          RUN_ID: gha_${{ github.run_id }}_1
        run: |
          set -euo pipefail
          python -B automation/three_line_rank_probability_calibration_e072.py --date "$RUN_DATE" --run-id "$RUN_ID"

      - name: Verify, preserve and publish outputs
        if: steps.one-shot.outputs.execute == 'true'
        env:
          RUN_DATE: '2026-11-18'
          RUN_ID: gha_${{ github.run_id }}_1
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B e072-preserve
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path

          study_id='E072_THREE_LINE_RANK_PROBABILITY_CALIBRATION_v1'
          run_date=os.environ['RUN_DATE']
          run_id=os.environ['RUN_ID']
          run_number=int(os.environ['GITHUB_RUN_ID'])
          run_url=os.environ['GITHUB_RUN_URL']
          result_path=Path('analysis')/run_date/run_id/study_id
          expected={'CALIBRATION_BINS.csv','COMPLETION.json','INFERENCE.json','MODEL_SPEC.json','PREDICTIONS.csv','REPORT.md','TARGET_METRICS.csv','VERIFICATION.json'}
          with (result_path/'SHA256_MANIFEST.csv').open('r',encoding='utf-8-sig',newline='') as f:
              manifest=list(csv.DictReader(f))
          if len(manifest)!=8 or {x['path'] for x in manifest}!=expected:
              raise SystemExit('E072 manifest count/coverage mismatch')
          for item in manifest:
              raw=(result_path/item['path']).read_bytes()
              if len(raw)!=int(item['bytes']) or hashlib.sha256(raw).hexdigest()!=item['sha256']:
                  raise SystemExit(f"E072 hash/size mismatch: {item['path']}")
          verification=json.loads((result_path/'VERIFICATION.json').read_text(encoding='utf-8'))
          inference=json.loads((result_path/'INFERENCE.json').read_text(encoding='utf-8'))
          if (verification.get('status')!='PASS' or verification.get('data_cutoff')!=1250
              or verification.get('data_rows')!=1250 or verification.get('training_targets')!=[201,600]
              or verification.get('evaluation_targets')!=[601,1250]
              or verification.get('training_candidate_observations')!=18000
              or verification.get('evaluation_targets_count')!=650
              or verification.get('evaluation_candidate_observations')!=29250
              or verification.get('random_permutations_total')!=78000
              or verification.get('training_feature_cutoff_violations')!=0
              or verification.get('feature_cutoff_violations')!=0
              or verification.get('future_predictions')!=0
              or verification.get('calibrator_uses_evaluation_outcomes') is not False
              or verification.get('leakage_failures')!=0
              or verification.get('manifest_entries')!=8
              or verification.get('manifest_status')!='PASS'
              or verification.get('strict_pass_ready') is not False
              or verification.get('purchase_recommendation_generated') is not False
              or inference.get('strict_pass_ready') is not False
              or inference.get('purchase_recommendation_generated') is not False):
              raise SystemExit('E072 verification/readiness gate failed')

          queue_path=Path('automation/research_queue_v2.json')
          queue=json.loads(queue_path.read_text(encoding='utf-8'))
          task=next(x for x in queue['tasks'] if x['id']==study_id)
          if task.get('execution_status')!='PREREGISTERED_PENDING_DEDICATED_WORKFLOW':
              raise SystemExit('E072 queue state changed before preservation')
          passed=bool(inference['calibration_gate_pass'])
          final_status='EXECUTED_HISTORICAL_CALIBRATION_PASS' if passed else 'EXECUTED_HISTORICAL_CALIBRATION_NO_EDGE'
          result={
              'verification_status':'PASS','calibration_gate_pass':passed,
              'strict_portfolio_pass':False,'strict_pass_ready':False,
              'purchase_recommendation_generated':False,'data_cutoff':1250,
              'training_targets':400,'evaluation_targets':650,
              'random_permutations_total':78000,'manifest_entries':8,
              'workflow_run_id':run_number,'workflow_run_url':run_url,
              'result_path':result_path.as_posix(),'metrics':inference['metrics'],
              'independent_research_axis':True,'independent_sample':False,
              'target_1251_three_line_readiness_eligible':False
          }
          task['execution_status']=final_status
          task['result_path']=result_path.as_posix()
          task['execution_result']=result
          task['execution_completed_at_kst']='2026-11-18'
          task['spec']['execution_status']=final_status
          task['spec']['strict_pass_ready']=False
          task['spec']['execution_result']=result
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          axis={'study_id':study_id,'evidence_class':inference['evidence_class'],
                'calibration_gate_pass':passed,'strict_portfolio_pass':False,
                'strict_pass_ready':False,'target_1251_three_line_readiness_eligible':False,
                'metrics':inference['metrics'],'data_cutoff':1250,
                'training_targets':[201,600],'evaluation_targets':[601,1250],
                'random_permutations_total':78000,'manifest_entries':8,
                'workflow_run_id':run_number,'workflow_run_url':run_url,
                'result_path':result_path.as_posix(),'data_sha256':verification['data_sha256']}
          for status_name in ('STRICT_PASS_STATUS_1251_20261118.json','MODEL_GATE_1251_20261118.json'):
              status_path=Path('research/weekly_purchase/1251')/status_name
              status=json.loads(status_path.read_text(encoding='utf-8'))
              studies=[x for x in status.get('additional_calibration_studies',[]) if x.get('study_id')!=study_id]
              studies.append(axis)
              status['additional_calibration_studies']=studies
              status['latest_calibration_study']=axis
              status_path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          daily_path=Path('research/weekly_purchase/1251/DAILY_MASTER_STATUS_1251_20261118.json')
          daily=json.loads(daily_path.read_text(encoding='utf-8'))
          daily['completed_today'].append(
              f"E072 frozen consensus-rank probability calibration completed; calibration_gate_pass={passed}; historical candidate-level only; no STRICT_PASS_READY. Result: {result_path.as_posix()}."
          )
          daily['next_start']='E072 candidate-level calibration is historical-only and cannot create STRICT_PASS_READY. Preserve frozen strict gates; await a formally specified prospective confirmation rule and recovery of legacy A/C/contrarian source implementations and confirmed purchase records.'
          daily_path.write_text(json.dumps(daily,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':final_status,'result_path':result_path.as_posix(),'run_id':run_number},indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "analysis/$RUN_DATE/$RUN_ID/E072_THREE_LINE_RANK_PROBABILITY_CALIBRATION_v1" automation/research_queue_v2.json research/weekly_purchase/1251/STRICT_PASS_STATUS_1251_20261118.json research/weekly_purchase/1251/MODEL_GATE_1251_20261118.json research/weekly_purchase/1251/DAILY_MASTER_STATUS_1251_20261118.json
          git commit -m "research: complete E072 candidate probability calibration"
          git push origin HEAD:main
          git rev-parse HEAD

name: lotto-today-repeated-core-v28
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-repeated-core-v28.yml'
      - 'automation/today_repeated_core_v28.py'
permissions:
  contents: write
jobs:
  validate-v28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V28
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_repeated_core_v28.py | tee "$RUNNER_TEMP/v28.log"
      - name: Verify V28
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/2026-10-30/TODAY_REPEATED_CORE_1248_V28.json').read_text())
          lines=d['current']['lines']
          assert d['target_round']==1248 and d['data_cutoff']==1247 and d['no_future_leakage'] is True
          assert len(lines)==5 and len({tuple(x) for x in lines})==5
          assert all(len(x)==6 and x==sorted(x) and len(set(x))==6 and all(1<=n<=45 for n in x) for x in lines)
          print(json.dumps({'strict_pass':d['inference']['strict_portfolio_pass'],'lines':lines,'rep':d['current']['chosen_rep'],'template':d['current']['chosen_template']},ensure_ascii=False))
          PY
      - name: Commit V28 report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-30/TODAY_REPEATED_CORE_1248_V28.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: repeated-core adaptive v28 for 1248'
          git pull --rebase origin main
          git push origin HEAD:main

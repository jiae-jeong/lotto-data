name: daily-lotto-research-v2

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul; GitHub may delay scheduled starts.
  workflow_dispatch:
  push:
    paths:
      - 'automation/daily_research_v2.py'
      - 'automation/research_engine_v2.py'
      - 'automation/expanded_studies_v2.py'
      - 'automation/research_queue_v2.json'
      - 'automation/check_environment_v2.py'
      - 'automation/tests_v2/**'
      - '.github/workflows/daily-lotto-research-v2.yml'

permissions:
  contents: read

concurrency:
  group: daily-lotto-research-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: -r automation/requirements-research-v2.txt
        continue-on-error: true
      - run: python -B automation/check_environment_v2.py --allow-theory-fallback
      - run: python -B -m unittest discover -s automation/tests_v2 -p 'test_*.py' -v

  study:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-daily-research-v2]')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: -r automation/requirements-research-v2.txt
        continue-on-error: true
      - name: Execute unfinished registered studies
        run: >-
          python -B automation/daily_research_v2.py
          --min-successful-studies 2 --max-successful-studies 3
          --required-empirical-studies 1
          --result-file "$RUNNER_TEMP/research-result.json"
      - name: Preserve validated research
        env:
          RESEARCH_RESULT: ${{ runner.temp }}/research-result.json
        run: |
          python -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd() / 'automation'))
          from daily_research_v2 import publication_paths
          root = Path.cwd().resolve()
          result = json.loads(Path(os.environ['RESEARCH_RESULT']).read_text())
          # Research quota completion is intentionally distinct from DAILY MASTER FULL_COMPLETE.
          assert result['research_quota_status'] == 'RESEARCH_QUOTA_COMPLETE'
          assert result['status'] == 'RESEARCH_QUOTA_COMPLETE'
          assert result['master_status'] == 'NOT_ASSESSED_BY_QUOTA_RUNNER'
          assert result['successful_studies_today'] >= result['minimum_successful_studies']
          assert result['empirical_studies_today'] >= result['required_empirical_studies']
          paths = publication_paths(root, result)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'commit', '-m', 'research: validated new study ' + result['date']], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PY
      - name: Preserve execution and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/research-result.json
            analysis/*/E*/**
            analysis/*/.attempts/**
            analysis/*/DAILY_MASTER_REPORT_*.md
          if-no-files-found: warn

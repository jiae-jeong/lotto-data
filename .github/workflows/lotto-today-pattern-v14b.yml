name: lotto-today-pattern-v14b

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-pattern-v14b.yml'

permissions:
  contents: write

jobs:
  validate-v14b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fixed top14 variant
        shell: bash
        run: |
          set -euo pipefail
          cp automation/today_support_pattern_bayes_v14.py /tmp/v14b.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v14b.py'); s=p.read_text()
          s=s.replace("ROOT=Path(__file__).resolve().parents[1]", "ROOT=Path.cwd()")
          s=s.replace("OUT=ROOT/'analysis/2026-10-23/TODAY_SUPPORT_PATTERN_BAYES_1247_V14.json'", "OUT=ROOT/'analysis/2026-10-23/TODAY_SUPPORT_PATTERN_BAYES_1247_V14B.json'")
          s=s.replace("POOL=18", "POOL=14")
          s=s.replace("'policy':'NONLINEAR_SUPPORT_PATTERN_EMPIRICAL_BAYES_V14'", "'policy':'NONLINEAR_SUPPORT_PATTERN_EMPIRICAL_BAYES_V14B_TOP14'")
          p.write_text(s)
          PY
      - name: Run V14B
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH="$GITHUB_WORKSPACE" python -B /tmp/v14b.py | tee "$RUNNER_TEMP/v14b.log"
      - name: Independently verify V14B
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/2026-10-23/TODAY_SUPPORT_PATTERN_BAYES_1247_V14B.json').read_text())
          assert d['target_round']==1247 and d['data_cutoff']==1246 and d['no_future_leakage'] is True
          assert d['policy']=='NONLINEAR_SUPPORT_PATTERN_EMPIRICAL_BAYES_V14B_TOP14'
          lines=d['current']['lines']
          assert len(lines)==5 and len({tuple(x) for x in lines})==5
          assert all(len(x)==6 and x==sorted(x) and len(set(x))==6 and all(1<=n<=45 for n in x) for x in lines)
          print(json.dumps({'status':'INDEPENDENT_PASS','strict_pass':d['inference']['strict_portfolio_pass'],'final_status':d['final_status'],'lines':lines,'top_numbers':d['current']['top_numbers']},ensure_ascii=False))
          PY
      - name: Commit V14B report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-23/TODAY_SUPPORT_PATTERN_BAYES_1247_V14B.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: top14 support-pattern Bayes v14b for 1247'
          git pull --rebase origin main
          git push origin HEAD:main

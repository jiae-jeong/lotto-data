name: target-1251-e075-publication-recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/weekly_purchase/1251/E075_PUBLICATION_RECOVERY_20261119.trigger'
permissions:
  contents: write
concurrency:
  group: target-1251-e075-publication-recovery
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen E075 v3 blobs, failed attempt, and canonical data
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, os, subprocess
          from pathlib import Path
          prereg_path=Path("research/weekly_purchase/1251/E075_E045_SELECTOR_ORDER_CONFORMANCE_PREREG_20261119_V3.json")
          runner_path=Path("automation/three_line_research_1251_e075_corrected_v2.py")
          test_path=Path("automation/tests_v2/test_three_line_e075_selector_order_audit_v2.py")
          queue_test_path=Path("automation/tests_v2/test_e075_queue_contract_v3.py")
          workflow_path=Path(".github/workflows/target-1251-e075-e045-selector-order-audit.yml")
          base_runner_path=Path("automation/three_line_research_1251_v1.py")
          reference_path=Path("automation/five_role_research_v9.py")
          b_model_path=Path("research/1245_final_pipeline_v3/recovered_original_assets/b_model_backtest.py")
          ac_model_path=Path("automation/recovered_models_v2.py")
          policy_path=Path("research/weekly_purchase/1251/THREE_LINE_POLICY_1251_PLUS.json")
          base_prereg_path=Path("research/weekly_purchase/1251/THREE_LINE_RESEARCH_PREREG_E045_20261114.json")
          refresh_path=Path("research/weekly_purchase/1251/E045_CUTOFF_REFRESH_1250_APPEND_ONLY_v1.json")
          v1_prereg_path=Path("research/weekly_purchase/1251/E075_E045_SELECTOR_ORDER_CONFORMANCE_PREREG_20261119.json")
          v2_prereg_path=Path("research/weekly_purchase/1251/E075_E045_SELECTOR_ORDER_CONFORMANCE_PREREG_20261119_V2.json")
          addendum_path=Path("research/weekly_purchase/1251/E075_EXECUTION_ATTEMPT_1_REPAIR_ADDENDUM_20261119.json")
          addendum_2_path=Path("research/weekly_purchase/1251/E075_EXECUTION_ATTEMPT_2_REPAIR_ADDENDUM_20261119.json")
          data_path=Path("lotto_data.csv")
          prereg=json.loads(prereg_path.read_text(encoding="utf-8"))
          queue=json.loads(Path("automation/research_queue_v2.json").read_text(encoding="utf-8"))
          task=next(x for x in queue["tasks"] if x.get("id")==prereg["study_id"])
          def blob(path):
              return subprocess.check_output(["git","rev-parse","HEAD:"+path.as_posix()],text=True).strip()
          expected={
              "runner_blob_sha":runner_path,"test_blob_sha":test_path,"queue_contract_test_blob_sha":queue_test_path,
              "workflow_blob_sha":workflow_path,"base_runner_blob_sha":base_runner_path,"reference_models_blob_sha":reference_path,
              "b_model_blob_sha":b_model_path,"ac_model_blob_sha":ac_model_path,"policy_blob_sha":policy_path,
              "data_blob_sha":data_path,"base_prereg_blob_sha":base_prereg_path,"cutoff_refresh_prereg_blob_sha":refresh_path,
              "v1_prereg_blob_sha":v1_prereg_path,"attempt_1_addendum_blob_sha":addendum_path,
              "v2_prereg_blob_sha":v2_prereg_path,"attempt_2_addendum_blob_sha":addendum_2_path}
          for key,path in expected.items(): assert prereg["frozen_blobs"][key]==blob(path),(key,prereg["frozen_blobs"][key],blob(path))
          assert task["preregistration_blob_sha"]==blob(prereg_path)
          assert task["execution_status"]=="PREREGISTERED_PENDING_DEDICATED_WORKFLOW"
          assert task["post_v3_attempt_history"][-1]["workflow_run_id"]==44426026061
          raw=data_path.read_bytes();data_sha=hashlib.sha256(raw).hexdigest()
          assert data_sha==prereg["source_data_full_file_sha256"]
          rows=[r for r in csv.DictReader(raw.decode("utf-8-sig").splitlines()) if r.get("round")]
          assert len(rows)==1250 and [int(r["round"]) for r in rows]==list(range(1,1251))
          for row in rows:
              nums=[int(row[f"no{i}"]) for i in range(1,7)];bonus=int(row["bonus"])
              assert len(set(nums))==6 and all(1<=n<=45 for n in nums) and 1<=bonus<=45 and bonus not in nums
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as stream: stream.write("data_sha="+data_sha+"\n")
          print(json.dumps({"status":"PREFLIGHT_PASS","data_cutoff":1250,"data_sha256":data_sha},ensure_ascii=False))
          PY
      - name: Compile and run frozen E075 v3 tests plus persistence regression test
        run: |
          python -m py_compile automation/three_line_research_1251_e075_corrected_v2.py automation/tests_v2/test_three_line_e075_selector_order_audit_v2.py automation/tests_v2/test_e075_queue_contract_v3.py automation/e075_persist_result_v1.py
          python -B -m unittest automation.tests_v2.test_three_line_e075_selector_order_audit_v2 automation.tests_v2.test_e075_queue_contract_v3 automation.tests_v2.test_e075_persistence_schema -v
      - name: Execute frozen E075 v3 walk-forward
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="2026-11-19"
          RUN_ID="gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python -B automation/three_line_research_1251_e075_corrected_v2.py --date "$RUN_DATE" --run-id "$RUN_ID"
      - name: Normalize warmup-inclusive selector denominators and refresh manifest
        env:
          RUN_DATE: ${{ steps.execute.outputs.date }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        run: |
          python - <<'PY'
          import csv,hashlib,re,os
          from pathlib import Path
          out=Path("analysis")/os.environ["RUN_DATE"]/os.environ["RUN_ID"]/"E075_E045_SELECTOR_ORDER_CONFORMANCE_CORRECTION_v1"
          p=out/"REPORT.md";report=p.read_text(encoding="utf-8")
          report,n1=re.subn(r"(downstream pool-content differences after earlier line selections: \d+)/1700",r"\1/2100 (two later-role comparisons per 1,050 warmup-plus-scored targets)",report)
          report,n2=re.subn(r"(Targets with one or more changed lines: \d+)/850",r"\1/1050 (warmup-plus-scored selector targets; outcome metrics use 850 targets)",report)
          report,n3=re.subn(r"(Legacy selected-ticket adjacency-order mismatches: \d+)",r"\1/3150 selector decisions",report)
          report,n4=re.subn(r"(Changed line assignments: \d+)",r"\1/3150 selector decisions",report)
          assert (n1,n2,n3,n4)==(1,1,1,1),(n1,n2,n3,n4)
          p.write_text(report,encoding="utf-8")
          mp=out/"SHA256_MANIFEST.csv";files=sorted((x for x in out.iterdir() if x.is_file() and x.name!=mp.name),key=lambda x:x.name)
          rows=[{"path":x.name,"sha256":hashlib.sha256(x.read_bytes()).hexdigest(),"bytes":x.stat().st_size} for x in files]
          with mp.open("w",encoding="utf-8-sig",newline="") as s:
              w=csv.DictWriter(s,fieldnames=["path","sha256","bytes"]);w.writeheader();w.writerows(rows)
          print({"report_scope_normalized":True,"manifest_entries":len(rows)})
          PY
      - name: Verify E075 output manifest, cutoff, leakage, geometry, and non-promotion
        env:
          RUN_DATE: ${{ steps.execute.outputs.date }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
          DATA_SHA: ${{ steps.preflight.outputs.data_sha }}
        run: |
          python - <<'PY'
          import csv,hashlib,json,os
          from pathlib import Path
          out=Path("analysis")/os.environ["RUN_DATE"]/os.environ["RUN_ID"]/"E075_E045_SELECTOR_ORDER_CONFORMANCE_CORRECTION_v1"
          expected={"PREDICTIONS.csv","RANDOM_BASELINE.csv","BLOCK_STABILITY.csv","INFERENCE.json","READINESS_UPDATE.json","VERIFICATION.json","COMPLETION.json","REPORT.md","SHA256_MANIFEST.csv"}
          assert {p.name for p in out.iterdir() if p.is_file()}==expected
          with (out/"SHA256_MANIFEST.csv").open(encoding="utf-8-sig",newline="") as s: manifest=list(csv.DictReader(s))
          assert len(manifest)==8 and {x["path"] for x in manifest}==expected-{"SHA256_MANIFEST.csv"}
          for x in manifest:
              raw=(out/x["path"]).read_bytes();assert len(raw)==int(x["bytes"]) and hashlib.sha256(raw).hexdigest()==x["sha256"]
          inf=json.loads((out/"INFERENCE.json").read_text());v=json.loads((out/"VERIFICATION.json").read_text());c=json.loads((out/"COMPLETION.json").read_text())
          assert c["status"]=="COMPLETE" and c["data_cutoff"]==1250 and c["target_range"]==[401,1250] and c["target_count"]==850
          assert v["status"]=="PASS" and v["data_sha256"]==os.environ["DATA_SHA"]
          assert v["training_cutoff_violations"]==0 and v["leakage_failures"]==0 and v["future_predictions"]==0 and v["no_future_leakage"] is True
          assert v["portfolio_geometry_violations"]==0 and v["random_geometry_violations"]==0
          assert v["candidate_pool_comparisons"]==3150 and v["candidate_pool_rule_identical"] is True and v["first_role_pool_mismatches"]==0
          assert inf["targets"]==850 and inf["random_bundles_total_per_version"]==102000 and inf["block_count"]==17
          assert inf["strict_pass_ready"] is False and v["strict_pass_ready"] is False and c["strict_pass_ready"] is False
          assert v["purchase_recommendation_generated"] is False and c["purchase_recommendation_generated"] is False
          print(json.dumps({"status":"OUTPUTS_VERIFIED","legacy_gate":inf["historical_strict_gate_pass_legacy"],"corrected_gate":inf["historical_strict_gate_pass_corrected"],"manifest_entries":len(manifest)},ensure_ascii=False))
          PY
      - name: Persist queue and daily status using the actual INFERENCE schema
        env:
          RUN_DATE: ${{ steps.execute.outputs.date }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
          DATA_SHA: ${{ steps.preflight.outputs.data_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -B automation/e075_persist_result_v1.py --date "$RUN_DATE" --run-id "$RUN_ID" --workflow-run-id "$GITHUB_RUN_ID" --run-number "$RUN_NUMBER" --run-attempt "$RUN_ATTEMPT" --run-url "$RUN_URL" --data-sha "$DATA_SHA"
      - name: Commit and push verified E075 outputs and status
        shell: bash
        run: |
          set -euo pipefail
          git add analysis/2026-11-19 automation/research_queue_v2.json research/daily/2026-11-19_E075_PUBLICATION_RECOVERY_ADDENDUM.md research/weekly_purchase/1251/DAILY_MASTER_STATUS_1251_20261119.json
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "research: recover E075 publication after persistence schema fix"
          git push origin HEAD:main
          find automation -type d -name __pycache__ -prune -exec rm -rf {} +
          find automation -type f -name '*.pyc' -delete
          test -z "$(git status --porcelain)"

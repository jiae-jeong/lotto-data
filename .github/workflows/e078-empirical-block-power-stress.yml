name: E078 empirical block-power stress

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e078-empirical-block-power-stress.yml"
      - "automation/e078_three_line_empirical_block_power_stress_v1.js"
      - "automation/e078_three_line_empirical_block_power_stress_v2.js"
      - "automation/e078_three_line_empirical_block_power_stress_v3.js"
      - "research/weekly_purchase/1251/E078_THREE_LINE_EMPIRICAL_BLOCK_POWER_STRESS_PREREG_20261121.json"

permissions:
  contents: write

jobs:
  empirical-block-power-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen sources
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify preregistration and execute E078
        run: |
          test -f research/weekly_purchase/1251/E078_THREE_LINE_EMPIRICAL_BLOCK_POWER_STRESS_PREREG_20261121.json
          node automation/e078_three_line_empirical_block_power_stress_v3.js
      - name: Preserve immutable results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/2026-11-21/E078_THREE_LINE_EMPIRICAL_BLOCK_POWER_STRESS_v2
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Record E078 empirical block-power stress results"
            git push origin HEAD:main
          fi

name: target-1251-e056-h005-fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/weekly_purchase/1251/E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_PREREG_20261116.json'
      - 'automation/h005_fix_structure_to_number_mapping_e056_v1.py'
      - 'automation/tests_v2/test_h005_fix_structure_to_number_mapping_e056.py'

permissions:
  contents: write

concurrency:
  group: target-1251-e056-h005-fix
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen preregistration, source pins, data, and unchanged policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, subprocess
          from pathlib import Path
          prereg_path=Path('research/weekly_purchase/1251/E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_PREREG_20261116.json')
          p=json.loads(prereg_path.read_text(encoding='utf-8'))
          assert p['study_id']=='E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_v1'
          assert p['date_kst']=='2026-11-16'
          assert p['preregistration_status']=='FROZEN_BEFORE_EXECUTION'
          assert p['data_cutoff']==1250 and p['target_range']==[201,1250] and p['target_count']==1050
          assert p['parameter_search'] is False and p['variants_evaluated']==1
          frozen=p['frozen_blobs']
          paths={
            'runner_blob_sha':'automation/h005_fix_structure_to_number_mapping_e056_v1.py',
            'test_blob_sha':'automation/tests_v2/test_h005_fix_structure_to_number_mapping_e056.py',
            'workflow_blob_sha':'.github/workflows/target-1251-e056-h005-fix.yml',
            'source_run_batch_blob_sha':'research/expansion_framework_v1/studies/study_batch_001/run_batch.py',
            'walkforward_core_blob_sha':'research/expansion_framework_v1/walkforward_core.py',
            'research_registry_blob_sha':'research/expansion_framework_v1/research_registry.csv',
            'policy_blob_sha':'research/weekly_purchase/1251/THREE_LINE_POLICY_1251_PLUS.json',
            'source_data_blob_sha':'lotto_data.csv',
            'queue_blob_sha':'automation/research_queue_v2.json',
            'readiness_audit_blob_sha':'research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261116.json',
            'orthogonal_workflow_blob_sha':'.github/workflows/orthogonal-research-v2.yml'
          }
          for key,path in paths.items():
              actual=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
              assert actual==frozen[key], f'Frozen blob mismatch for {path}: {actual} != {frozen[key]}'
          sha=lambda path:hashlib.sha256(Path(path).read_bytes()).hexdigest()
          for key,path in {
            'data_sha256':'lotto_data.csv',
            'source_run_batch_sha256':'research/expansion_framework_v1/studies/study_batch_001/run_batch.py',
            'walkforward_core_sha256':'research/expansion_framework_v1/walkforward_core.py',
            'research_registry_sha256':'research/expansion_framework_v1/research_registry.csv'
          }.items():
              assert sha(path)==p[key], f'SHA256 mismatch for {path}'
          assert sha('lotto_data.csv')=='7203238dae69ce281c59e6a0928cc187b11d88ed342685cd2dd2f214f063b3c2'
          rows=list(csv.DictReader(Path('lotto_data.csv').open(encoding='utf-8-sig',newline='')))
          assert len(rows)==1250
          assert [int(r['round']) for r in rows]==list(range(1,1251))
          for row in rows:
              nums=[int(row[f'no{i}']) for i in range(1,7)]
              bonus=int(row['bonus'])
              assert len(set(nums))==6 and all(1<=n<=45 for n in nums)
              assert 1<=bonus<=45 and bonus not in nums
          policy=json.loads(Path('research/weekly_purchase/1251/THREE_LINE_POLICY_1251_PLUS.json').read_text())
          gate=policy['strict_gate']
          assert policy['purchase_lines']==3 and policy['effective_from_target']==1251
          assert gate['family_alpha']==0.05 and gate['alpha_per_metric']==0.0125
          assert gate['any2_positive_nonoverlapping_50_target_block_share_min']==0.65
          assert gate['no_threshold_relaxation'] is True
          registry=list(csv.DictReader(Path('research/expansion_framework_v1/research_registry.csv').open(encoding='utf-8-sig',newline='')))
          assert not any(r.get('research_id')=='H005_FIX' for r in registry)
          print('E056 frozen provenance, cutoff, source hashes, candidate policy, and canonical data PASS')
          PY
      - name: Compile and run isolated E056 contract tests
        run: |
          python -m py_compile automation/h005_fix_structure_to_number_mapping_e056_v1.py automation/tests_v2/test_h005_fix_structure_to_number_mapping_e056.py
          python -B -m unittest automation.tests_v2.test_h005_fix_structure_to_number_mapping_e056 -v
      - name: Execute frozen historical H005_FIX diagnostic
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(TZ=Asia/Seoul date +%F)"
          test "$DATE" = "2026-11-16"
          python -B automation/h005_fix_structure_to_number_mapping_e056_v1.py --date "$DATE" --run-id "$GITHUB_RUN_ID" | tee "$RUNNER_TEMP/e056-result.json"
          echo "RUN_DATE=$DATE" >> "$GITHUB_ENV"
      - name: Verify predictions, exact random baseline, cutoff, and immutable manifest
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          out=Path('analysis')/os.environ['RUN_DATE']/os.environ['GITHUB_RUN_ID']/'E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_v1'
          completion=json.loads((out/'COMPLETION.json').read_text())
          verification=json.loads((out/'VERIFICATION.json').read_text())
          audit=json.loads((out/'mapping_audit.json').read_text())
          baseline=json.loads((out/'random_baseline.json').read_text())
          assert completion['status']=='COMPLETE'
          assert completion['data_cutoff']==1250 and completion['target_range']==[201,1250] and completion['target_count']==1050
          assert completion['classification']=='HISTORICAL_DIAGNOSTIC_ONLY'
          assert verification['status']=='PASS'
          assert verification['data_cutoff']==1250 and verification['data_rows']==1250
          assert verification['target_range']==[201,1250] and verification['target_count']==1050
          assert verification['training_cutoff_violations']==0 and verification['leakage_failures']==0
          assert verification['exact_random_baseline_executed'] is True
          assert verification['strict_portfolio_pass'] is False and verification['strict_pass_ready'] is False
          assert verification['purchase_recommendation_generated'] is False
          assert abs(float(baseline['mean_hits'])-0.8)<1e-12
          assert audit['legacy_mapping_algebra_checks']==1050
          assert audit['corrected_structure_vector']['length']==45
          assert audit['corrected_structure_vector']['selected_count']==6
          assert audit['corrected_structure_vector']['unselected_count']==39
          assert audit['corrected_structure_vector']['appended_once'] is True
          assert abs(270.0/51.0-5.2941176470588235)<1e-12
          predictions=list(csv.DictReader((out/'walkforward_predictions.csv').open(encoding='utf-8-sig',newline='')))
          assert len(predictions)==1050
          assert [int(r['target_round']) for r in predictions]==list(range(201,1251))
          assert all(int(r['training_through_round'])==int(r['target_round'])-1 for r in predictions)
          assert all(int(r['training_start_round'])==1 for r in predictions)
          metrics=list(csv.DictReader((out/'model_metrics.csv').open(encoding='utf-8-sig',newline='')))
          assert len(metrics)==24
          expected={'walkforward_predictions.csv','model_metrics.csv','model_correlation.csv','study_registry.csv','failure_registry.csv','surviving_models.csv','mapping_audit.json','random_baseline.json','MODEL_SPEC.json','VERIFICATION.json','COMPLETION.json','REPORT.md'}
          manifest=list(csv.DictReader((out/'SHA256_MANIFEST.csv').open(encoding='utf-8-sig',newline='')))
          assert len(manifest)==12 and {r['path'] for r in manifest}==expected
          for row in manifest:
              raw=(out/row['path']).read_bytes()
              assert len(raw)==int(row['bytes'])
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
          report=(out/'REPORT.md').read_text()
          assert 'HISTORICAL_DIAGNOSTIC_ONLY' in report or 'historical diagnostic' in report.lower()
          assert 'No promotion' in report and 'no purchase numbers generated' in report
          print(json.dumps({'status':'PASS','targets':len(predictions),'metrics':len(metrics),'manifest_entries':len(manifest),'mapping_changed_targets':audit['mapping_changed_targets'],'historical_classification':completion['model_status'],'strict_pass_ready':False}))
          PY
      - name: Update append-only research queue and readiness audit
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          date=os.environ['RUN_DATE']; rid=int(os.environ['GITHUB_RUN_ID'])
          out=Path('analysis')/date/str(rid)/'E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_v1'
          completion=json.loads((out/'COMPLETION.json').read_text())
          verification=json.loads((out/'VERIFICATION.json').read_text())
          audit_result=json.loads((out/'mapping_audit.json').read_text())
          queue_path=Path('automation/research_queue_v2.json')
          queue=json.loads(queue_path.read_text(encoding='utf-8'))
          matches=[t for t in queue['tasks'] if t['id']=='E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_v1']
          assert len(matches)==1
          task=matches[0]
          task['execution_status']='EXECUTED_HISTORICAL_DIAGNOSTIC_ONLY'
          task['spec']['execution_status']='EXECUTED_HISTORICAL_DIAGNOSTIC_ONLY'
          task['execution_result']={
            'workflow_run_id':rid,'workflow_run_url':os.environ['GITHUB_RUN_URL'],
            'result_path':out.as_posix(),'data_cutoff':1250,'target_range':[201,1250],
            'target_count':1050,'mapping_changed_targets':audit_result['mapping_changed_targets'],
            'legacy_mapping_algebra_checks':audit_result['legacy_mapping_algebra_checks'],
            'historical_classification':completion['model_status'],
            'verification_status':verification['status'],'manifest_entries':12,
            'strict_portfolio_pass':False,'strict_pass_ready':False,
            'purchase_recommendation_generated':False,
            'evidence_class':'HISTORICAL_SINGLE_TICKET_DIAGNOSTIC_NOT_THREE_LINE_READINESS'
          }
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          audit_path=Path('research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261116.json')
          audit=json.loads(audit_path.read_text(encoding='utf-8'))
          audit['ineligible_research']['E056']='Executed H005_FIX single-ticket structure-to-number mapping repair; historical diagnostic only; not a three-line portfolio axis, not prospective confirmation, and not eligible for STRICT_PASS_READY.'
          audit['research_queue_status']['registered_tasks']=42
          audit['research_queue_status']['pending_dedicated_tasks']=[x for x in audit['research_queue_status'].get('pending_dedicated_tasks',[]) if x!='E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_v1']
          audit['research_queue_status']['pending_dedicated_task_scope']='E043 H1250-A and E044 H1250-B V2 remain five-line-only; E056 H005_FIX is a completed single-ticket historical diagnostic and is ineligible for target-1251 three-line readiness.'
          audit['research_queue_status'].setdefault('completed_dedicated_tasks',{})['E056']='EXECUTED_HISTORICAL_DIAGNOSTIC_ONLY'
          audit['research_queue_status']['target_1251_e056_status']='EXECUTED_HISTORICAL_DIAGNOSTIC_ONLY'
          audit['research_queue_status']['target_1251_e056_workflow_run_id']=rid
          audit['research_queue_status']['target_1251_e056_preregistration']='research/weekly_purchase/1251/E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_PREREG_20261116.json'
          audit['research_queue_status']['target_1251_e056_runner']='automation/h005_fix_structure_to_number_mapping_e056_v1.py'
          audit['research_queue_status']['target_1251_e056_workflow']='.github/workflows/target-1251-e056-h005-fix.yml'
          audit['research_queue_status']['generic_queue_preflight_validation']='NO_GENERIC_RESEARCH_PENDING; E056 dedicated H005_FIX single-ticket historical diagnostic completed; it is not three-line readiness evidence; E043/E044 remain five-line-only.'
          audit['research_queue_status']['runnable_generic_task_count']=0
          audit['research_queue_status']['three_line_preregistered_axes_remaining']=[]
          audit['research_queue_status']['three_line_axis_status']='E055_EXECUTED; NO_UNEXECUTED_PREREGISTERED_THREE_LINE_AXES; E056_IS_SINGLE_TICKET_DIAGNOSTIC_ONLY'
          audit['research_queue_status']['unregistered_code_artifacts']=[x for x in audit['research_queue_status'].get('unregistered_code_artifacts',[]) if x.get('study_id')!='E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_v1']
          audit['e056_h005_fix_diagnostic']={
            'workflow_run_id':rid,'workflow_run_url':os.environ['GITHUB_RUN_URL'],
            'result_path':out.as_posix(),'data_cutoff':1250,'target_count':1050,
            'mapping_changed_targets':audit_result['mapping_changed_targets'],
            'legacy_mapping_algebra_checks':audit_result['legacy_mapping_algebra_checks'],
            'historical_classification':completion['model_status'],
            'verification_status':'PASS','manifest_entries':12,
            'strict_portfolio_pass':False,'strict_pass_ready':False,
            'purchase_recommendation_generated':False
          }
          audit['strict_portfolio_pass']=False
          audit['strict_pass_ready']=False
          audit['ready_file_exists']=False
          audit['line_level_output_status']='SUPPRESSED_NOT_READY'
          audit['note']+='\n2026-11-16: E056 H005_FIX completed as a separate single-ticket historical diagnostic on cutoff 1250; it does not qualify as a three-line portfolio axis or prospective confirmation. Legacy S008 mapping constant verified as 270/51, and the corrected one-vector membership mapping was evaluated without parameter search. No strict readiness or purchase lines were created.'
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit immutable E056 evidence and updated queue
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "analysis/$RUN_DATE/$GITHUB_RUN_ID/E056_H005_FIX_STRUCTURE_TO_NUMBER_MAPPING_v1" automation/research_queue_v2.json research/weekly_purchase/1251/THREE_LINE_READINESS_AUDIT_20261116.json
          git diff --cached --quiet && { echo 'No E056 evidence staged' >&2; exit 1; }
          git commit -m "research: execute E056 H005_FIX mapping diagnostic"
          git push origin HEAD:main

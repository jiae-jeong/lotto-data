name: lotto-today-research-v8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-research-v8.yml'

permissions:
  contents: write

jobs:
  validate-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run data-driven V8 research portfolio
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_research_portfolio_v8.py | tee "$RUNNER_TEMP/v8.log"
      - name: Independently verify V8 output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('analysis/2026-10-23/TODAY_RESEARCH_PORTFOLIO_1247_V8.json')
          d=json.loads(p.read_text())
          assert d['target_round']==1247 and d['data_cutoff']==1246 and d['no_future_leakage'] is True
          assert d['policy']=='FIXED_FIVE_ROLE_RESEARCH_PORTFOLIO_V8'
          assert len(d['roles'])==5 and len(d['final_lines'])==5
          lines=d['final_lines']
          assert len({tuple(x) for x in lines})==5
          assert all(len(x)==6 and x==sorted(x) and len(set(x))==6 and all(1<=n<=45 for n in x) for x in lines)
          assert d['random_comparator'].startswith('Random permutation of labels')
          print(json.dumps({'status':'INDEPENDENT_PASS','strict_pass':d['inference']['strict_portfolio_pass'],'lines':lines,'roles':[x['role'] for x in d['roles']]},ensure_ascii=False))
          PY
      - name: Commit V8 report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-23/TODAY_RESEARCH_PORTFOLIO_1247_V8.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: 1247 data-driven five-role portfolio v8'
          git pull --rebase origin main
          git push origin HEAD:main

name: lotto-today-twostage-v67
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-twostage-v67.yml'
      - 'automation/today_twostage_rank_ticket_v67.py'
permissions:
  contents: read
jobs:
  validate-v67:
    strategy:
      fail-fast: false
      matrix:
        mode: [recall_any3, recall_any2, recall_joint, recall_stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V67 two-stage selector
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          V67_MODE="$MODE" python -B automation/today_twostage_rank_ticket_v67.py
      - name: Print strict result
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          m=os.environ['MODE'];d=json.load(open(f'analysis/2026-10-30/TODAY_TWOSTAGE_RANK_TICKET_{m}_1248_V67.json'))
          print(json.dumps({'mode':m,'strict_pass':d['inference']['strict_portfolio_pass'],'status':d['final_status'],'delta':d['scorecard']['delta'],'ci':{k:v['adjusted_ci_delta'] for k,v in d['inference'].items() if isinstance(v,dict)},'share':{k:v['positive_50_round_block_share'] for k,v in d['inference'].items() if isinstance(v,dict)},'lines':d['current']['lines'],'policy':d['current']['chosen_policy'],'rank_mode':d['current']['rank_mode']},ensure_ascii=False))
          PY

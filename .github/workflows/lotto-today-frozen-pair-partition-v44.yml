name: lotto-today-frozen-pair-partition-v44
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-frozen-pair-partition-v44.yml'
      - 'automation/today_frozen_pair_partition_v44.py'
      - 'automation/today_frozen_signal_partition_v42.py'
permissions:
  contents: write
jobs:
  validate-v44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V44
        shell: bash
        run: |
          set -euo pipefail
          python -B automation/today_frozen_pair_partition_v44.py | tee "$RUNNER_TEMP/v44.log"
      - name: Verify V44
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/2026-10-30/TODAY_FROZEN_PAIR_PARTITION_1248_V44.json').read_text())
          L=d['current']['lines']
          assert d['target_round']==1248 and d['data_cutoff']==1247 and d['no_future_leakage'] is True
          assert len(L)==5 and len({tuple(x) for x in L})==5 and len(set().union(*map(set,L)))==30
          print(json.dumps({'strict_pass':d['inference']['strict_portfolio_pass'],'status':d['final_status'],'policy':d['current']['chosen_policy'],'lines':L},ensure_ascii=False))
          PY
      - name: Commit V44 report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-30/TODAY_FROZEN_PAIR_PARTITION_1248_V44.json
          git diff --cached --quiet && exit 0
          git commit -m 'validation: frozen pair partition v44 for 1248'
          git pull --rebase origin main
          git push origin HEAD:main

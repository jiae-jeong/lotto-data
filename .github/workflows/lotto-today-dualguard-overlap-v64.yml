name: lotto-today-dualguard-overlap-v64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lotto-today-dualguard-overlap-v64.yml'
      - 'automation/today_dualguard_overlap_v64.py'
permissions:
  contents: read
jobs:
  validate-v64:
    strategy:
      fail-fast: false
      matrix:
        mode: [dualguard, any2lift, triguard, pareto, any23guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V64 dual guard
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          DUAL_MODE="$MODE" python -B automation/today_dualguard_overlap_v64.py
      - name: Print strict result
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          m=os.environ['MODE'];d=json.load(open(f'analysis/2026-10-30/TODAY_DUALGUARD_OVERLAP_{m}_1248_V64.json'))
          print(json.dumps({'mode':m,'strict_pass':d['inference']['strict_portfolio_pass'],'status':d['final_status'],'delta':d['scorecard']['delta'],'ci':{k:v['adjusted_ci_delta'] for k,v in d['inference'].items() if isinstance(v,dict)},'share':{k:v['positive_50_round_block_share'] for k,v in d['inference'].items() if isinstance(v,dict)},'lines':d['current']['lines'],'policy':d['current']['chosen_policy'],'null':d['scorecard']['matched_exact_label_null']},ensure_ascii=False))
          PY
